      "id": 1779973923035,
      "title": "職種いろいろ",
      "htmlContent": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\" />\n<title>職種別・働く現場シーン プロンプト生成ツール Compact</title>\n<style>\n:root{\n  --bg:#f5f7fb;--card:#fff;--text:#151b2d;--muted:#697184;--line:#e5e8f0;\n  --main:#5b5ce2;--main2:#00a884;--dark:#151827;--soft:#f1f3f8;\n  --shadow:0 10px 28px rgba(28,36,70,.08);--r:18px;\n}\n*{box-sizing:border-box}\nbody{\n  margin:0;background:linear-gradient(180deg,#fbfcff,#f2f5fb);color:var(--text);\n  font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n}\nbutton,input,select,textarea{font:inherit}\n.app{max-width:1320px;margin:auto;padding:12px}\n.header{\n  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;\n  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;\n  box-shadow:var(--shadow);margin-bottom:10px\n}\nh1{font-size:22px;line-height:1.25;margin:0;letter-spacing:-.03em}\n.sub{font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}\n.count{font-size:12px;color:var(--muted);font-weight:900;white-space:nowrap}\n.grid{display:grid;grid-template-columns:420px 1fr;gap:10px;align-items:start}\n.panel{\n  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;\n  box-shadow:var(--shadow)\n}\n.sticky{position:sticky;top:10px}\n.row{display:grid;gap:8px}\n.two{grid-template-columns:1fr 1fr}\n.three{grid-template-columns:repeat(3,1fr)}\n.four{grid-template-columns:repeat(4,1fr)}\n.title{\n  display:flex;align-items:center;justify-content:space-between;gap:8px;\n  font-size:14px;font-weight:950;margin:2px 0 8px\n}\n.title small{font-size:11px;color:var(--muted);font-weight:800}\n.step{\n  display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;\n  border-radius:8px;background:#eef0ff;color:#4b45cf;font-size:12px;font-weight:950\n}\n.btn,.chip,.job,.scene{\n  border:0;cursor:pointer;border-radius:14px;transition:.15s ease;-webkit-tap-highlight-color:transparent\n}\n.btn:hover,.chip:hover,.job:hover,.scene:hover{transform:translateY(-1px)}\n.btn{\n  padding:11px 10px;background:var(--soft);color:#33394c;font-weight:950\n}\n.btn.active{background:linear-gradient(135deg,var(--main),#4547ca);color:#fff;box-shadow:0 8px 20px rgba(91,92,226,.22)}\n.search{\n  display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);\n  border-radius:14px;padding:8px 10px;margin:8px 0\n}\n.search input{border:0;outline:0;width:100%;background:transparent;font-size:13px}\n.jobgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;max-height:390px;overflow:auto;padding-right:2px}\n.job{\n  text-align:left;background:#fff;border:1px solid var(--line);padding:9px;\n  min-height:58px\n}\n.job.active{border-color:rgba(91,92,226,.55);background:#f7f7ff;box-shadow:0 8px 20px rgba(91,92,226,.12)}\n.jtop{display:flex;align-items:center;gap:7px}\n.ico{width:27px;height:27px;border-radius:10px;background:#f1f3f8;display:grid;place-items:center;font-size:16px;flex:0 0 auto}\n.jname{font-size:13px;font-weight:950;line-height:1.2}\n.jtag{font-size:10px;color:var(--muted);font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.scenegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}\n.scene{\n  text-align:left;background:#fff;border:1px solid var(--line);padding:10px;min-height:74px\n}\n.scene.active{border-color:rgba(0,168,132,.55);background:#f0fffb;box-shadow:0 8px 20px rgba(0,168,132,.10)}\n.stitle{font-size:13px;font-weight:950;margin:0 0 4px}\n.sdesc{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0}\n.compact-controls{\n  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px\n}\n.box{border:1px solid var(--line);border-radius:16px;padding:10px;background:#fbfcff}\n.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}\n.chip{\n  padding:8px 7px;min-height:34px;background:var(--soft);color:#33394c;\n  font-size:12px;font-weight:900\n}\n.chip.active{background:var(--dark);color:#fff}\nselect,textarea{\n  width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:9px 10px;outline:0;\n  font-size:13px;color:var(--text)\n}\ntextarea{min-height:66px;resize:vertical;line-height:1.55}\n.field span{display:block;font-size:11px;color:var(--muted);font-weight:900;margin-bottom:5px}\n.output-actions{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}\n.action{\n  border:0;border-radius:13px;padding:9px 11px;font-size:12px;font-weight:950;cursor:pointer;background:var(--soft)\n}\n.action.primary{background:linear-gradient(135deg,var(--main),#4547ca);color:#fff}\n.action.green{background:linear-gradient(135deg,var(--main2),#008f72);color:#fff}\n.prompt{\n  background:#101423;color:#eef2ff;border-radius:16px;padding:12px;\n  min-height:310px;white-space:pre-wrap;line-height:1.65;font-size:12.5px;overflow:auto\n}\n.empty{grid-column:1/-1;background:#fff8e8;color:#755324;border:1px solid #ffe1a6;border-radius:14px;padding:12px;font-weight:900;font-size:13px}\ndetails{\n  margin-top:10px;border:1px solid var(--line);border-radius:16px;background:#fbfcff;overflow:hidden\n}\nsummary{\n  list-style:none;cursor:pointer;padding:10px 12px;font-size:13px;font-weight:950\n}\nsummary::-webkit-details-marker{display:none}\n.details-inner{padding:0 10px 10px}\n.toast{\n  position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(12px);\n  background:#111827;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;font-size:12px;\n  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:10\n}\n.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}\n@media(max-width:980px){\n  .grid{grid-template-columns:1fr}\n  .sticky{position:static}\n  .header{align-items:flex-start}\n  .compact-controls{grid-template-columns:1fr}\n}\n@media(max-width:560px){\n  .app{padding:8px}\n  .header{display:block;padding:12px}\n  h1{font-size:18px}\n  .count{margin-top:6px}\n  .panel{padding:10px;border-radius:16px}\n  .jobgrid{grid-template-columns:repeat(2,1fr);max-height:none}\n  .scenegrid{grid-template-columns:1fr}\n  .four,.three,.two{grid-template-columns:1fr 1fr}\n  .chips{grid-template-columns:repeat(2,1fr)}\n  .prompt{min-height:300px}\n}\n</style>\n</head>\n<body>\n<div class=\"app\">\n  <header class=\"header\">\n    <div>\n      <h1>職種別・働く現場シーン<br>画像生成プロンプト補助ツール</h1>\n      <div class=\"sub\">屋外/屋内 → 職種 → シーン → 表情・状況を選んで、完成プロンプトを生成</div>\n    </div>\n    <div class=\"count\">30職種 / コンパクト版</div>\n  </header>\n\n  <main class=\"grid\">\n    <section class=\"panel sticky\">\n      <div class=\"title\"><span><span class=\"step\">1</span>屋外 / 屋内を選択</span></div>\n      <div class=\"row two\">\n        <button class=\"btn active\" data-cat=\"outdoor\">屋外の職種</button>\n        <button class=\"btn\" data-cat=\"indoor\">屋内の職種</button>\n      </div>\n\n      <div class=\"title\" style=\"margin-top:12px\"><span><span class=\"step\">2</span>職種を選択</span><small id=\"catLabel\">屋外</small></div>\n      <div class=\"search\"><span>🔎</span><input id=\"search\" placeholder=\"職種検索\"></div>\n      <div class=\"jobgrid\" id=\"jobGrid\"></div>\n    </section>\n\n    <section class=\"row\">\n      <div class=\"panel\">\n        <div class=\"title\"><span><span class=\"step\">3</span>職種に合わせたシーン</span><small id=\"jobLabel\">未選択</small></div>\n        <div class=\"scenegrid\" id=\"sceneGrid\"></div>\n\n        <details open>\n          <summary>表情・状況・画づくりを選択</summary>\n          <div class=\"details-inner\">\n            <div class=\"compact-controls\">\n              <div class=\"box\">\n                <div class=\"title\">表情 <small>1つ選択</small></div>\n                <div class=\"chips\" id=\"exprGrid\"></div>\n              </div>\n              <div class=\"box\">\n                <div class=\"title\">働いている状況 <small>1つ選択</small></div>\n                <div class=\"chips\" id=\"moodGrid\"></div>\n              </div>\n              <div class=\"box\">\n                <div class=\"title\">仕上げ <small>1つ選択</small></div>\n                <div class=\"chips\" id=\"styleGrid\"></div>\n              </div>\n              <div class=\"box row\">\n                <label class=\"field\"><span>アスペクト比</span>\n                  <select id=\"aspect\">\n                    <option value=\"9:16 vertical smartphone composition\">9:16 縦型スマホ</option>\n                    <option value=\"1:1 square composition\">1:1 正方形</option>\n                    <option value=\"4:5 portrait social media composition\">4:5 SNS縦</option>\n                    <option value=\"16:9 cinematic wide composition\">16:9 横長</option>\n                  </select>\n                </label>\n                <label class=\"field\"><span>カメラ</span>\n                  <select id=\"camera\">\n                    <option value=\"realistic eye-level documentary camera angle, natural perspective\">自然な目線</option>\n                    <option value=\"slightly low angle, heroic workplace perspective\">少しローアングル</option>\n                    <option value=\"slightly high angle, clear view of tools and workplace\">少し俯瞰</option>\n                    <option value=\"dynamic wide-angle perspective, foreground tools blurred\">広角で迫力</option>\n                    <option value=\"cinematic close-up portrait, shallow depth of field\">表情アップ</option>\n                  </select>\n                </label>\n              </div>\n            </div>\n            <div class=\"box\" style=\"margin-top:10px\">\n              <label class=\"field\"><span>人物指定・追加条件</span>\n                <textarea id=\"custom\" placeholder=\"例：参照画像の人物を使う。髪型と雰囲気を保つ。制服は清潔感のあるデザイン。\"></textarea>\n              </label>\n            </div>\n          </div>\n        </details>\n      </div>\n\n      <div class=\"panel\">\n        <div class=\"title\">完成プロンプト <small>コピーして画像生成へ</small></div>\n        <div class=\"output-actions\">\n          <button class=\"action primary\" id=\"copyBtn\">コピー</button>\n          <button class=\"action green\" id=\"randomBtn\">ランダム</button>\n          <button class=\"action\" id=\"resetBtn\">リセット</button>\n          <button class=\"action\" id=\"negBtn\">ネガティブだけコピー</button>\n        </div>\n        <div class=\"prompt\" id=\"prompt\"></div>\n      </div>\n    </section>\n  </main>\n</div>\n<div class=\"toast\" id=\"toast\"></div>\n\n<script>\nconst jobs=[\n{id:\"construction\",cat:\"outdoor\",icon:\"🏗️\",name:\"建設作業員\",tag:\"工事現場\",outfit:\"helmet, safety vest, work gloves, rugged workwear\",scenes:[[\"鉄骨の組み立て\",\"高層建築現場で鉄骨を確認しながら作業している\"],[\"資材搬入\",\"複数人で重い資材を運び、現場が慌ただしく動いている\"],[\"安全確認\",\"図面とチェックリストを見ながら作業前確認をしている\"],[\"ミスの注意\",\"資材の置き場を間違え、先輩から冷静に指導を受けている\"]]},\n{id:\"road\",cat:\"outdoor\",icon:\"🚧\",name:\"道路工事スタッフ\",tag:\"交通誘導\",outfit:\"reflective uniform, helmet, safety boots, traffic baton\",scenes:[[\"交通誘導\",\"車の流れを見ながら誘導棒で安全に交通整理している\"],[\"舗装作業\",\"熱いアスファルトをならしながらチームで作業している\"],[\"休憩待機\",\"作業車の横で次の工程を待ち、少しヒマそうにしている\"],[\"緊急対応\",\"道路上の危険物を見つけ、急いで安全確保している\"]]},\n{id:\"delivery\",cat:\"outdoor\",icon:\"📦\",name:\"宅配ドライバー\",tag:\"配達\",outfit:\"delivery uniform, cap, handheld scanner, comfortable shoes\",scenes:[[\"荷物の配達\",\"両手に荷物を抱えて玄関先へ急いでいる\"],[\"不在票対応\",\"不在で困りながら端末を操作している\"],[\"荷物整理\",\"配達車の荷台で大量の段ボールを仕分けしている\"],[\"遅延で焦る\",\"雨の中、時間指定に間に合わせようと急いでいる\"]]},\n{id:\"farmer\",cat:\"outdoor\",icon:\"🌾\",name:\"農家\",tag:\"畑・収穫\",outfit:\"farm workwear, boots, gloves, sun hat\",scenes:[[\"野菜の収穫\",\"朝日の中で新鮮な野菜を収穫している\"],[\"水やり\",\"広い畑でホースや散水設備を使って作業している\"],[\"作物チェック\",\"葉や実の状態を真剣に確認している\"],[\"天候トラブル\",\"急な雨に慌てて収穫物を守っている\"]]},\n{id:\"fisher\",cat:\"outdoor\",icon:\"🎣\",name:\"漁師\",tag:\"港・船上\",outfit:\"waterproof fishing gear, rubber boots, gloves\",scenes:[[\"網を引く\",\"船上で仲間と力を合わせて漁網を引き上げている\"],[\"魚の仕分け\",\"港で魚箱を並べ、鮮魚を素早く仕分けている\"],[\"出港準備\",\"夜明け前の港で道具を確認している\"],[\"荒天対応\",\"強い風と波の中、安全を確認しながら作業している\"]]},\n{id:\"gardener\",cat:\"outdoor\",icon:\" c uniform, unrelated job props, wrong workplace, messy composition, unreadable text, watermark, logo, overly violent scene`;\n}\nfunction render(){\n  document.querySelectorAll(\"[data-cat]\").forEach(b=>b.classList.toggle(\"active\",b.dataset.cat===state.cat));\n  $(\"catLabel\").textContent=state.cat===\"outdoor\"?\"屋外\":\"屋内\";\n  renderJobs();renderScenes();\n  chip(\"exprGrid\",expr,state.expr,x=>state.expr=x);\n  chip(\"moodGrid\",mood,state.mood,x=>state.mood=x);\n  chip(\"styleGrid\",style,state.style,x=>state.style=x);\n  $(\"prompt\").textContent=promptText();\n}\nfunction toast(t){$(\"toast\").textContent=t;$(\"toast\").classList.add(\"show\");setTimeout(()=>$(\"toast\").classList.remove(\"show\"),1300)}\nasync function copy(t,msg){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement(\"textarea\");a.value=t;document.body.appendChild(a);a.select();document.execCommand(\"copy\");a.remove()}toast(msg)}\ndocument.querySelectorAll(\"[data-cat]\").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;state.job=null;state.scene=0;$(\"search\").value=\"\";render()});\n$(\"search\").oninput=render;$(\"custom\").oninput=render;$(\"aspect\").onchange=render;$(\"camera\").onchange=render;\n$(\"copyBtn\").onclick=()=>copy(promptText(),\"コピーしました\");\n$(\"negBtn\").onclick=()=>copy(\"【ネガティブ】\\n\"+promptText().split(\"【ネガティブ】\").pop().trim(),\"ネガティブをコピーしました\");\n$(\"resetBtn\").onclick=()=>{state.cat=\"outdoor\";state.job=null;state.scene=0;state.expr=expr[0];state.mood=mood[0];state.style=style[0];$(\"search\").value=\"\";$(\"custom\").value=\"\";$(\"aspect\").selectedIndex=0;$(\"camera\").selectedIndex=0;render();toast(\"リセットしました\")};\n$(\"randomBtn\").onclick=()=>{state.cat=Math.random()>.5?\"outdoor\":\"indoor\";const pool=jobs.filter(j=>j.cat===state.cat);state.job=pool[Math.floor(Math.random()*pool.length)];state.scene=Math.floor(Math.random()*state.job.scenes.length);state.expr=expr[Math.floor(Math.random()*expr.length)];state.mood=mood[M       "htmlContent": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>スマホ飛び出し画像プロンプト生成ツール</title>\n  <style>\n    :root {\n      --bg: #0a1120;\n      --panel: #111a2d;\n      --panel2: #19253d;\n      --text: #eef3ff;\n      --muted: #a8b4d4;\n      --accent: #77d3ff;\n      --accent2: #b98eff;\n      --border: rgba(255,255,255,.12);\n      --shadow: 0 16px 35px rgba(0,0,0,.3);\n      --radius: 16px;\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      color: var(--text);\n      background:\n        radial-gradient(circle at top left, rgba(119,211,255,.14), transparent 30%),\n        radial-gradient(circle at top right, rgba(185,142,255,.12), transparent 28%),\n        linear-gradient(180deg, #0a1120 0%, #111a2d 100%);\n    }\n\n    .wrap {\n      max-width: 1080px;\n      margin: 0 auto;\n      padding: 16px;\n    }\n\n    .panel {\n      background: rgba(17,26,45,.92);\n      border: 1px solid var(--border);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n    }\n\n    .header {\n      padding: 18px;\n      margin-bottom: 14px;\n    }\n\n    .header h1 {\n      margin: 0 0 8px;\n      font-size: clamp(22px, 3vw, 32px);\n      line-height: 1.2;\n    }\n\n    .header p {\n      margin: 0;\n      color: var(--muted);\n      line-height: 1.7;\n      font-size: 14px;\n    }\n\n    .summary {\n      display: grid;\n      grid-template-columns: repeat(4, minmax(0, 1fr));\n      gap: 10px;\n      margin-top: 14px;\n    }\n\n    .summaryItem {\n      background: rgba(255,255,255,.04);\n      border: 1px solid var(--border);\n      border-radius: 14px;\n      padding: 10px 12px;\n    }\n\n    .summaryItem small {\n      display: block;\n      color: var(--muted);\n      font-size: 11px;\n      margin-bottom: 5px;\n    }\n\n    .summaryItem div {\n      font-size: 13px;\n      font-weight: 700;\n      line-height: 1.4;\n    }\n\n    .main {\n      display: grid;\n      grid-template-columns: 1fr;\n      gap: 14px;\n    }\n\n    .builder {\n      padding: 14px;\n    }\n\n    .tabs {\n      display: grid;\n      grid-template-columns: repeat(4, 1fr);\n      gap: 8px;\n      margin-bottom: 14px;\n    }\n\n    .tabBtn {\n      border: 1px solid var(--border);\n      background: rgba(255,255,255,.04);\n      color: var(--text);\n      border-radius: 12px;\n      padding: 11px 10px;\n      font-size: 13px;\n      font-weight: 700;\n      cursor: pointer;\n      transition: .15s ease;\n    }\n\n    .tabBtn.active {\n      background: linear-gradient(135deg, rgba(119,211,255,.22), rgba(185,142,255,.18));\n      border-color: rgba(119,211,255,.65);\n      box-shadow: 0 8px 20px rgba(119,211,255,.12);\n    }\n\n    .tabPanel {\n      display: none;\n    }\n\n    .tabPanel.active {\n      display: block;\n    }\n\n    .sectionTitle {\n      margin: 0 0 10px;\n      font-size: 16px;\n    }\n\n    .sectionDesc {\n      color: var(--muted);\n      font-size: 12px;\n      margin: 0 0 12px;\n      line-height: 1.6;\n    }\n\n    .optionGrid {\n      display: grid;\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 10px;\n    }\n\n    .option {\n      position: relative;\n      display: block;\n    }\n\n    .option input {\n      position: absolute;\n      opacity: 0;\n      pointer-events: none;\n    }\n\n    .optionCard {\n      min-height: 72px;\n      border-radius: 14px;\n      border: 1px solid var(--border);\n      background: rgba(255,255,255,.04);\n      padding: 12px 12px 12px 36px;\n      cursor: pointer;\n      position: relative;\n      transition: .15s ease;\n    }\n\n    .optionCard:hover {\n      border-color: rgba(119,211,255,.45);\n      background: rgba(255,255,255,.06);\n    }\n\n    .optionCard::before {\n      content: \"\";\n      position: absolute;\n      left: 12px;\n      top: 14px;\n      width: 14px;\n      height: 14px;\n      border-radius: 50%;\n      border: 2px solid rgba(255,255,255,.34);\n    }\n\n    .option input:checked + .optionCard {\n      background: linear-gradient(180deg, rgba(119,211,255,.15), rgba(185,142,255,.08));\n      border-color: rgba(119,211,255,.85);\n      box-shadow: 0 8px 20px rgba(119,211,255,.10);\n    }\n\n    .option input:checked + .optionCard::before {\n      border-color: var(--accent);\n      background: radial-gradient(circle, var(--accent) 0 45%, transparent 46% 100%);\n    }\n\n    .optionCard b {\n      display: block;\n      font-size: 13px;\n      margin-bottom: 4px;\n      line-height: 1.35;\n    }\n\n    .optionCard span {\n      display: block;\n      font-size: 11px;\n      color: var(--muted);\n      line-height: 1.45;\n    }\n\n    .controls {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 8px;\n      margin-top: 14px;\n    }\n\n    button {\n      border: none;\n      cursor: pointer;\n      border-radius: 12px;\n      padding: 11px 14px;\n      font-weight: 800;\n      font-size: 13px;\n      color: #071321;\n      background: linear-gradient(135deg, var(--accent), #a7ebff);\n      box-shadow: 0 8px 18px rgba(119,211,255,.22);\n    }\n\n    button.secondary {\n      background: rgba(255,255,255,.07);\n      color: var(--text);\n      border: 1px solid var(--border);\n      box-shadow: none;\n    }\n\n    .output {\n      padding: 14px;\n    }\n\n    .output h2 {\n      margin: 0 0 10px;\n      font-size: 16px;\n    }\n\n    textarea {\n      width: 100%;\n      min-height: 260px;\n      border-radius: 14px;\n      border: 1px solid var(--border);\n      background: #091120;\n      color: var(--text);\n      padding: 14px;\n      resize: vertical;\n      line-height: 1.7;\n      font-size: 13px;\n      outline: none;\n    }\n\n    textarea:focus {\n      border-color: rgba(119,211,255,.65);\n    }\n\n    .memo {\n      margin-top: 12px;\n    }\n\n    .memo label {\n      display: block;\n      margin-bottom: 8px;\n      font-size: 13px;\n      font-weight: 700;\n    }\n\n    .memo textarea {\n      min-height: 90px;\n    }\n\n    .note {\n      margin-top: 12px;\n      font-size: 12px;\n      color: var(--muted);\n      line-height: 1.7;\n      padding: 12px;\n      border-radius: 14px;\n      border: 1px dashed rgba(255,255,255,.18);\n      background: rgba(255,255,255,.04);\n    }\n\n    @media (max-width: 900px) {\n      .summary {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n\n      .optionGrid {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n    }\n\n    @media (max-width: 640px) {\n      .wrap {\n        padding: 12px;\n      }\n\n      .header, .builder, .output {\n        padding: 12px;\n      }\n\n      .tabs {\n        grid-template-columns: repeat(2, 1fr);\n      }\n\n      .summary {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n\n      .optionGrid {\n        grid-template-columns: repeat(2, minmax(0, 1fr));\n      }\n\n      .optionCard {\n        min-height: 68px;\n        padding: 10px 10px 10px 34px;\n      }\n\n      .optionCard b {\n        font-size: 12px;\n      }\n\n      .optionCard span {\n        font-size: 10.5px;\n      }\n    }\n  </style>\n</head>\n<body>\n  <div class=\"wrap\">\n    <section class=\"panel header\">\n      <h1>スマホ飛び出し画像プロンプト生成ツール</h1>\n      <p>\n        スマホの種類・カラー・飛び出し方・背景を選ぶだけで、\n        「人物がスマホ画面から飛び出している」画像生成用プロンプトを自動作成します。\n        画面が縦長になりすぎないよう、カテゴリごとにタブ切り替え式でコンパクトにまとめています。\n      </p>\n\n      <div class=\"summary\">\n        <div class=\"summaryItem\">\n          <small>スマホ種類</small>\n          <div id=\"sumPhoneType\">-</div>\n        </div>\n        <div class=\"summaryItem\">\n          <small>本体カラー</small>\n          <div id=\"sumPhoneColor\">-</div>\n        </div>\n        <div class=\"summaryItem\">\n          <small>飛び出し演出</small>\n          <div id=\"sumPopoutStyle\">-</div>\n        </div>\n        <div class=\"summaryItem\">\n          <small>背景</small>\n          <div id=\"sumBackgroundType\">-</div>\n        </div>\n      </div>\n    </section>\n\n    <div class=\"main\">\n      <section class=\"panel builder\">\n        <div class=\"tabs\">\n          <button class=\"tabBtn active\" data-tab=\"phoneType\">スマホ種類</button>\n          <button class=\"tabBtn\" data-tab=\"phoneColor\">本体カラー</button>\n          <button class=\"tabBtn\" data-tab=\"popoutStyle\">飛び出し方</button>\n          <button class=\"tabBtn\" data-tab=\"backgroundType\">背景</button>\n        </div>\n\n        <div id=\"panel-phoneType\" class=\"tabPanel active\">\n          <h2 class=\"sectionTitle\">スマホの種類</h2>\n          <p class=\"sectionDesc\">端末の見た目や印象を選択してください。</p>\n          <div class=\"optionGrid\" id=\"phoneType\"></div>\n        </div>\n\n        <div id=\"panel-phoneColor\" class=\"tabPanel\">\n          <h2 class=\"sectionTitle\">スマホのカラー</h2>\n          <p class=\"sectionDesc\">本体色・質感の方向性を選択してください。</p>\n          <div class=\"optionGrid\" id=\"phoneColor\"></div>\n        </div>\n\n        <div id=\"panel-popoutStyle\" class=\"tabPanel\">\n          <h2 class=\"sectionTitle\">飛び出し方</h2>\n          <p class=\"sectionDesc\">人物がスマホからどう飛び出すかを選択してください。</p>\n          <div class=\"optionGrid\" id=\"popoutStyle\"></div>\n        </div>\n\n        <div id=\"panel-backgroundType\" class=\"tabPanel\">\n          <h2 class=\"sectionTitle\">背景の種類</h2>\n          <p class=\"sectionDesc\">世界観や仕上がりの印象を選択してください。</p>\n          <div class=\"optionGrid\" id=\"backgroundType\"></div>\n        </div>\n\n        <div class=\"memo\">\n          <label for=\"extraMemo\">追加メモ（任意）</label>\n          <textarea id=\"extraMemo\" placeholder=\"例：上部に大きく『Haruka』と入れる、Instagram風UIにする、白いマスクをつける、など\"></textarea>\n        </div>\n\n        <div class=\"controls\">\n          <button type=\"button\" id=\"randomBtn\">ランダム選択</button>\n          <button type=\"button\" id=\"resetBtn\" class=\"secondary\">初期状態に戻す</button>\n        </div>\n      </section>\n\n      <section class=\"panel output\">\n        <h2>生成プロンプト</h2>\n        <textarea id=\"promptOutput\"></textarea>\n\n        <div class=\"controls\">\n          <button type=\"button\" id=\"copyBtn\">コピーする</button>\n          <button type=\"button\" id=\"refreshBtn\" class=\"secondary\">再生成</button>\n        </div>\n\n        <div class=\"note\">\n          必要に応じて、生成AI側で<br>\n          「アップロードした人物画像をアイデンティティ参照として使用してください」<br>\n          を追加すると、人物の雰囲気を維持しやすくなります。\n        </div>\n      </section>\n    </div>\n  </div>\n\n  <script>\n    const options = {\n      phoneType: [\n        {\n          value: \"iphone_dynamic\",\n          title: \"iPhone（Dynamic Island）\",\n          desc: \"新しめで高級感のある定番型\",\n          prompt: \"Dynamic Islandを備えた高級感のあるiPhone風スマートフォン\"\n        },\n        {\n          value: \"iphone_notch\",\n          title: \"iPhone（ノッチ）\",\n          desc: \"SNS画面と相性のよい王道型\",\n          prompt: \"ノッチ付きの現代的なiPhone風スマートフォン\"\n        },\n        {\n          value: \"android_slim\",\n          title: \"Android（細ベゼル）\",\n          desc: \"シャープで洗練された印象\",\n          prompt: \"薄いベゼルの洗練されたAndroidスマートフォン\"\n        },\n        {\n          value: \"foldable\",\n          title: \"折りたたみスマホ\",\n          desc: \"画面が大きく派手な演出向け\",\n          prompt: \"開いた状態の折りたたみスマートフォン\"\n        },\n        {\n          value: \"gaming\",\n          title: \"ゲーミングスマホ\",\n          desc: \"発光感のある近未来デザイン\",\n          prompt: \"発光ディテールを持つ近未来的なゲーミングスマートフォン\"\n        },\n        {\n          value: \"transparent\",\n          title: \"クリアデザイン\",\n          desc: \"半透明で個性的な端末\",\n          prompt: \"半透明パーツが見えるユニークなクリアデザインのスマートフォン\"\n        }\n      ],\n\n      phoneColor: [\n        {\n          value: \"black\",\n          title: \"ブラック\",\n          desc: \"シックでコントラストが強い\",\n          prompt: \"本体カラーはブラック\"\n        },\n        {\n          value: \"white\",\n          title: \"ホワイト\",\n          desc: \"清潔感があり明るい\",\n          prompt: \"本体カラーはホワイト\"\n        },\n        {\n          value: \"silver\",\n          title: \"シルバー\",\n          desc: \"金属感が強くクール\",\n          prompt: \"本体カラーはシルバー\"\n        },\n        {\n          value: \"gold\",\n          title: \"ゴールド\",\n          desc: \"華やかでラグジュアリー\",\n          prompt: \"本体カラーはゴールド\"\n        },\n        {\n          value: \"pink\",\n          title: \"ピンク\",\n          desc: \"可愛く柔らかな印象\",\n          prompt: \"本体カラーはやさしいピンク\"\n        },\n        {\n          value: \"blue\",\n          title: \"ブルー\",\n          desc: \"爽やかで近未来的\",\n          prompt: \"本体カラーは深みのあるブルー\"\n        }\n      ],\n\n      popoutStyle: [\n        {\n          value: \"hand_reach\",\n          title: \"手を前に大きく伸ばす\",\n          desc: \"強い遠近感で迫力重視\",\n          prompt: \"人物がスマホ画面から大きく手を伸ばして前方へ飛び出している。強い遠近感\"\n        },\n        {\n          value: \"glass_break\",\n          title: \"画面を破って出る\",\n          desc: \"ガラス破片でインパクト大\",\n          prompt: \"人物の上半身がスマホ画面を破って飛び出している。周囲に砕けたガラス破片が舞う\"\n        },\n        {\n          value: \"fullbody_step\",\n          title: \"全身で踏み出す\",\n          desc: \"足元まで見せる立体構図\",\n          prompt: \"人物がスマホの中から全身で一歩踏み出して出てきている。立体感が強い\"\n        },\n        {\n          value: \"lean_out\",\n          title: \"フレームにもたれる\",\n          desc: \"自然で可愛い演出\",\n          prompt: \"人物がスマホフレームに手をかけ、画面から身を乗り出している\"\n        },\n        {\n          value: \"jump_out\",\n          title: \"勢いよくジャンプ\",\n          desc: \"躍動感と動き重視\",\n          prompt: \"人物がスマホ画面から勢いよくジャンプして飛び出している。髪や衣装が躍動的に流れる\"\n        },\n        {\n          value: \"magic_portal\",\n          title: \"光のポータル風\",\n          desc: \"幻想的で華やか\",\n          prompt: \"人物がスマホ画面の中の発光ポータルから浮かび上がるように飛び出している。光粒子が広がる\"\n        }\n      ],\n\n      backgroundType: [\n        {\n          value: \"black_glass\",\n          title: \"黒背景 × ガラス破片\",\n          desc: \"王道で迫力のある定番構成\",\n          prompt: \"背景は黒を基調とし、周囲に飛び散るガラス破片とハイライトがある\"\n        },\n        {\n          value: \"neon_city\",\n          title: \"ネオンシティ\",\n          desc: \"都会的でサイバー感\",\n          prompt: \"背景はネオンに光る都会の夜景で、サイバー感のある雰囲気\"\n        },\n        {\n          value: \"pastel_sparkle\",\n          title: \"パステルキラキラ\",\n          desc: \"可愛く華やかな印象\",\n          prompt: \"背景はパステルカラーのきらめきとボケ光で満たされた夢かわ系\"\n        },\n        {\n          value: \"white_studio\",\n          title: \"白スタジオ\",\n          desc: \"すっきり見せる商品風\",\n          prompt: \"背景は白いスタジオ空間で、清潔感のあるシンプルなライティング\"\n        },\n        {\n          value: \"cosmic\",\n          title: \"宇宙・星雲\",\n          desc: \"幻想的で壮大な世界観\",\n          prompt: \"背景は幻想的な宇宙や星雲、きらめく星屑\"\n        },\n        {\n          value: \"stage_light\",\n          title: \"ステージライト\",\n          desc: \"ライブ感・スポット演出\",\n          prompt: \"背景はライブステージのような光線とスポットライトで、華やかでドラマチック\"\n        }\n      ]\n    };\n\n    const defaults = {\n      phoneType: \"iphone_dynamic\",\n      phoneColor: \"black\",\n      popoutStyle: \"hand_reach\",\n      backgroundType: \"black_glass\"\n    };\n\n    function createOptionCards(category) {\n      const container = document.getElementById(category);\n      container.innerHTML = \"\";\n\n      options[category].forEach(item => {\n        const label = document.createElement(\"label\");\n        label.className = \"option\";\n\n        label.innerHTML = `\n          <input type=\"radio\" name=\"${category}\" value=\"${item.value}\">\n          <div class=\"optionCard\">\n            <b>${item.title}</b>\n            <span>${item.desc}</span>\n          </div>\n        `;\n\n        container.appendChild(label);\n      });\n\n      const defaultInput = container.querySelector(`input[value=\"${defaults[category]}\"]`);\n      if (defaultInput) defaultInput.checked = true;\n    }\n\n    function getSelected(category) {\n      const checked = document.querySelector(`input[name=\"${category}\"]:checked`);\n      return options[category].find(item => item.value === checked.value);\n    }\n\n    function buildPrompt() {\n      const phoneType = getSelected(\"phoneType\");\n      const phoneColor = getSelected(\"phoneColor\");\n      const popoutStyle = getSelected(\"popoutStyle\");\n      const backgroundType = getSelected(\"backgroundType\");\n      const extraMemo = document.getElementById(\"extraMemo\").value.trim();\n\n      document.getElementById(\"sumPhoneType\").textContent = phoneType.title;\n      document.getElementById(\"sumPhoneColor\").textContent = phoneColor.title;\n      document.getElementById(\"sumPopoutStyle\").textContent = popoutStyle.title;\n      document.getElementById(\"sumBackgroundType\").textContent = backgroundType.title;\n\n      let prompt = `【スマホ飛び出し画像生成プロンプト】\n\n人物がスマホ画面の中から現実空間へ立体的に飛び出している、インパクトのある画像。\nスマホUIが見える構図で、画面の内側から人物がこちら側へ出てくる演出。\n人物が主役で、遠近感と奥行きが強く伝わる構図。\n\n【スマホの種類】\n${phoneType.prompt}。\n\n【スマホのカラー】\n${phoneColor.prompt}。\n\n【飛び出し方】\n${popoutStyle.prompt}。\n\n【背景】\n${backgroundType.prompt}。\n\n【演出】\n必要に応じて、ガラス破片、光粒子、画面の割れ、被写界深度、迫力のあるライティングを加える。\n人物の手や髪や衣装が画面外へ出ている部分は、立体感が強く見えるようにする。\n高品質でシネマティック、SNSで目を引くビジュアル。\n縦長 9:16、ディテール豊富、印象的な立体演出。`;\n\n      if (extraMemo) {\n        prompt += `\n\n【追加指定】\n${extraMemo}`;\n      }\n\n      document.getElementById(\"promptOutput\").value = prompt;\n    }\n\n    function bindRadios() {\n      document.querySelectorAll('input[type=\"radio\"]').forEach(input => {\n        input.addEventListener(\"change\", buildPrompt);\n      });\n    }\n\n    function randomSelect() {\n      Object.keys(options).forEach(category => {\n        const list = options[category];\n        const random = list[Math.floor(Math.random() * list.length)];\n        const input = document.querySelector(`input[name=\"${category}\"][value=\"${random.value}\"]`);\n        if (input) input.checked = true;\n      });\n      buildPrompt();\n    }\n\n    function resetSelect() {\n      Object.keys(defaults).forEach(category => {\n        const input = document.querySelector(`input[name=\"${category}\"][value=\"${defaults[category]}\"]`);\n        if (input) input.checked = true;\n      });\n      document.getElementById(\"extraMemo\").value = \"\";\n      buildPrompt();\n    }\n\n    async function copyPrompt() {\n      const textarea = document.getElementById(\"promptOutput\");\n      textarea.select();\n      textarea.setSelectionRange(0, textarea.value.length);\n\n      try {\n        await navigator.clipboard.writeText(textarea.value);\n      } catch (e) {\n        document.execCommand(\"copy\");\n      }\n\n      const btn = document.getElementById(\"copyBtn\");\n      const oldText = btn.textContent;\n      btn.textContent = \"コピーしました\";\n      setTimeout(() => {\n        btn.textContent = oldText;\n      }, 1200);\n    }\n\n    function setupTabs() {\n      const buttons = document.querySelectorAll(\".tabBtn\");\n      const panels = document.querySelectorAll(\".tabPanel\");\n\n      buttons.forEach(btn => {\n        btn.addEventListener(\"click\", () => {\n          const tab = btn.dataset.tab;\n\n          buttons.forEach(b => b.classList.remove(\"active\"));\n          panels.forEach(p => p.classList.remove(\"active\"));\n\n          btn.classList.add(\"active\");\n          document.getElementById(`panel-${tab}`).classList.add(\"active\");\n        });\n      });\n    }\n\n    Object.keys(options).forEach(createOptionCards);\n    bindRadios();\n    setupTabs();\n\n    document.getElementById(\"extraMemo\").addEventListener(\"input\", buildPrompt);\n    document.getElementById(\"randomBtn\").addEventListener(\"click\", randomSelect);\n    document.getElementById(\"resetBtn\").addEventListener(\"click\", resetSelect);\n    document.getElementById(\"copyBtn\").addEventListener(\"click\", copyPrompt);\n    document.getElementById(\"refreshBtn\").addEventListener(\"click\", buildPrompt);\n\n    buildPrompt();\n  <\/script>\n</body>\n</html>"
    },

      "id": 1779974023647,
      "title": "トランプ",
      "htmlContent": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>Instagram風トランプカード プロンプト補助ツール</title>\n\n  <style>\n    :root {\n      --bg-1: #090711;\n      --bg-2: #171022;\n      --line: rgba(255, 255, 255, 0.18);\n      --text: #fff7ec;\n      --muted: rgba(255, 247, 236, 0.68);\n      --gold: #f7d47b;\n      --pink: #ff4fa3;\n      --shadow: 0 30px 80px rgba(0, 0, 0, 0.42);\n      --radius-xl: 28px;\n      --radius-lg: 20px;\n      --font-main: \"Hiragino Sans\", \"Yu Gothic\", \"Meiryo\", system-ui, sans-serif;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      min-height: 100vh;\n      font-family: var(--font-main);\n      color: var(--text);\n      background:\n        radial-gradient(circle at 12% 12%, rgba(255, 79, 163, 0.35), transparent 28%),\n        radial-gradient(circle at 88% 8%, rgba(88, 199, 255, 0.26), transparent 25%),\n        radial-gradient(circle at 50% 105%, rgba(247, 212, 123, 0.20), transparent 34%),\n        linear-gradient(135deg, var(--bg-1), var(--bg-2) 50%, #06040b);\n      overflow-x: hidden;\n    }\n\n    body::before,\n    body::after {\n      content: \"\";\n      position: fixed;\n      inset: -20%;\n      pointer-events: none;\n      z-index: -1;\n      background-image:\n        radial-gradient(circle, rgba(255,255,255,.22) 0 1px, transparent 1.8px),\n        radial-gradient(circle, rgba(247,212,123,.32) 0 1px, transparent 2px);\n      background-size: 72px 72px, 118px 118px;\n      background-position: 0 0, 32px 18px;\n      opacity: 0.24;\n      animation: sparkleMove 18s linear infinite;\n    }\n\n    body::after {\n      opacity: 0.12;\n      filter: blur(1px);\n      animation-duration: 30s;\n      animation-direction: reverse;\n    }\n\n    @keyframes sparkleMove {\n      from {\n        transform: translate3d(0,0,0) rotate(0deg);\n      }\n      to {\n        transform: translate3d(48px, -48px, 0) rotate(2deg);\n      }\n    }\n\n    .shell {\n      width: min(1100px, calc(100% - 32px));\n      margin: 0 auto;\n      padding: 24px 0 46px;\n    }\n\n    .hero {\n      position: relative;\n      border: 1px solid var(--line);\n      border-radius: var(--radius-xl);\n      padding: 28px 30px;\n      overflow: hidden;\n      box-shadow: var(--shadow);\n      background:\n        linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.04)),\n        radial-gradient(circle at 20% 10%, rgba(247, 212, 123, .20), transparent 36%),\n        radial-gradient(circle at 80% 20%, rgba(255, 79, 163, .16), transparent 32%);\n      backdrop-filter: blur(22px);\n      margin-bottom: 20px;\n    }\n\n    .hero::before {\n      content: \"\";\n      position: absolute;\n      inset: 0;\n      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,.18) 42%, transparent 58%);\n      transform: translateX(-120%);\n      animation: heroSheen 7s ease-in-out infinite;\n    }\n\n    @keyframes heroSheen {\n      0%, 42% {\n        transform: translateX(-120%);\n      }\n      64%, 100% {\n        transform: translateX(120%);\n      }\n    }\n\n    .hero-content {\n      position: relative;\n      z-index: 1;\n    }\n\n    .badge {\n      display: inline-flex;\n      align-items: center;\n      gap: 8px;\n      width: fit-content;\n      padding: 8px 12px;\n      border: 1px solid rgba(247, 212, 123, .42);\n      border-radius: 999px;\n      color: var(--gold);\n      background: rgba(247, 212, 123, .08);\n      font-size: 13px;\n      letter-spacing: .04em;\n      box-shadow: inset 0 0 18px rgba(247, 212, 123, .08);\n    }\n\n    h1 {\n      margin: 14px 0 0;\n      font-size: clamp(28px, 4vw, 50px);\n      line-height: 1.08;\n      letter-spacing: -0.06em;\n    }\n\n    .gradient-text {\n      background: linear-gradient(90deg, #fff8d6, var(--gold), #ff77b7, #9fdcff);\n      -webkit-background-clip: text;\n      color: transparent;\n      text-shadow: 0 0 32px rgba(247, 212, 123, .18);\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: 1fr;\n      gap: 22px;\n      align-items: start;\n    }\n\n    .panel {\n      border: 1px solid var(--line);\n      border-radius: var(--radius-xl);\n      background:\n        linear-gradient(135deg, rgba(255,255,255,.11), rgba(255,255,255,.045)),\n        rgba(255,255,255,.04);\n      box-shadow: var(--shadow);\n      backdrop-filter: blur(20px);\n      overflow: hidden;\n    }\n\n    .panel-header {\n      padding: 18px 20px;\n      border-bottom: 1px solid var(--line);\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      gap: 12px;\n    }\n\n    .panel-header h2 {\n      margin: 0;\n      font-size: 18px;\n      letter-spacing: -.03em;\n    }\n\n    .panel-header span {\n      color: var(--muted);\n      font-size: 12px;\n    }\n\n    .panel-body {\n      padding: 20px;\n    }\n\n    .section-title {\n      margin: 0 0 14px;\n      color: #fff6d8;\n      font-size: 14px;\n      letter-spacing: .05em;\n      text-transform: uppercase;\n      display: flex;\n      align-items: center;\n      gap: 9px;\n    }\n\n    .section-title::before {\n      content: \"\";\n      width: 8px;\n      height: 8px;\n      border-radius: 999px;\n      background: linear-gradient(135deg, var(--gold), var(--pink));\n      box-shadow: 0 0 18px rgba(247, 212, 123, .8);\n    }\n\n    .control-block {\n      padding: 18px;\n      border: 1px solid rgba(255,255,255,.13);\n      background: rgba(255,255,255,.055);\n      border-radius: var(--radius-lg);\n      margin-bottom: 16px;\n      transition: opacity .2s ease, filter .2s ease;\n    }\n\n    .control-block.locked {\n      opacity: 0.55;\n      filter: grayscale(0.15);\n    }\n\n    .joker-notice {\n      display: none;\n      margin-top: 12px;\n      padding: 12px 14px;\n      border-radius: 14px;\n      border: 1px solid rgba(163, 255, 117, 0.25);\n      background: linear-gradient(135deg, rgba(86, 255, 122, 0.10), rgba(149, 87, 255, 0.12));\n      color: #f7f7ff;\n      font-size: 13px;\n      line-height: 1.7;\n    }\n\n    .joker-notice.show {\n      display: block;\n    }\n\n    .grid-2,\n    .grid-3 {\n      display: grid;\n      gap: 12px;\n    }\n\n    .grid-2 {\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n    }\n\n    .grid-3 {\n      grid-template-columns: repeat(3, minmax(0, 1fr));\n    }\n\n    label {\n      display: block;\n      margin-bottom: 7px;\n      color: rgba(255, 247, 236, .88);\n      font-size: 13px;\n      font-weight: 800;\n    }\n\n    input,\n    select,\n    textarea {\n      width: 100%;\n      border: 1px solid rgba(255,255,255,.18);\n      border-radius: 14px;\n      background: rgba(7, 5, 14, .62);\n      color: var(--text);\n      font: inherit;\n      font-size: 14px;\n      outline: none;\n      transition: border .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s ease;\n    }\n\n    input,\n    select {\n      min-height: 46px;\n      padding: 0 13px;\n    }\n\n    textarea {\n      min-height: 340px;\n      padding: 16px;\n      resize: vertical;\n      line-height: 1.85;\n      white-space: pre-wrap;\n    }\n\n    input:focus,\n    select:focus,\n    textarea:focus {\n      border-color: rgba(247, 212, 123, .70);\n      box-shadow: 0 0 0 4px rgba(247, 212, 123, .12);\n      background: rgba(7, 5, 14, .78);\n    }\n\n    input:disabled,\n    select:disabled {\n      opacity: 0.55;\n      cursor: not-allowed;\n    }\n\n    select option {\n      background: #181020;\n      color: #fff7ec;\n    }\n\n    input[type=\"color\"] {\n      height: 46px;\n      padding: 4px;\n      cursor: pointer;\n    }\n\n    .suit-buttons,\n    .rank-grid,\n    .chip-grid {\n      display: grid;\n      gap: 10px;\n    }\n\n    /* Suitは2列 */\n    .suit-buttons {\n      grid-template-columns: repeat(2, 1fr);\n    }\n\n    .rank-grid {\n      grid-template-columns: repeat(7, 1fr);\n      gap: 8px;\n    }\n\n    .chip-grid {\n      grid-template-columns: repeat(3, 1fr);\n    }\n\n    .suit-btn,\n    .rank-btn,\n    .chip-btn {\n      border: 1px solid rgba(255,255,255,.18);\n      border-radius: 16px;\n      color: var(--text);\n      background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.035));\n      cursor: pointer;\n      transition: transform .18s ease, border .18s ease, box-shadow .18s ease, background .18s ease;\n      font-family: inherit;\n      font-weight: 900;\n    }\n\n    .suit-btn {\n      min-height: 72px;\n      display: grid;\n      place-items: center;\n      gap: 3px;\n      padding: 10px;\n    }\n\n    .rank-btn {\n      min-height: 44px;\n      font-size: 13px;\n    }\n\n    .rank-btn.joker-btn {\n      background:\n        linear-gradient(135deg, rgba(105,255,134,.18), rgba(160,81,255,.22)),\n        rgba(255,255,255,.06);\n      border-color: rgba(176, 255, 129, 0.28);\n    }\n\n    .chip-btn {\n      min-height: 46px;\n      padding: 8px 10px;\n      font-size: 13px;\n    }\n\n    .suit-symbol {\n      display: block;\n      font-size: 30px;\n      line-height: 1;\n    }\n\n    .suit-label {\n      font-size: 12px;\n      color: var(--muted);\n    }\n\n    .suit-btn:hover,\n    .rank-btn:hover,\n    .chip-btn:hover {\n      transform: translateY(-2px);\n      border-color: rgba(247, 212, 123, .5);\n      box-shadow: 0 12px 26px rgba(0,0,0,.18);\n    }\n\n    .suit-btn.active,\n    .rank-btn.active,\n    .chip-btn.active {\n      border-color: rgba(247, 212, 123, .72);\n      background:\n        linear-gradient(135deg, rgba(247,212,123,.28), rgba(255,79,163,.18)),\n        rgba(255,255,255,.08);\n      box-shadow:\n        0 0 0 1px rgba(247,212,123,.16) inset,\n        0 0 28px rgba(247, 212, 123, .16);\n    }\n\n    .rank-btn.joker-btn.active {\n      border-color: rgba(140, 255, 111, 0.9);\n      background:\n        linear-gradient(135deg, rgba(79, 255, 114, 0.30), rgba(168, 76, 255, 0.30)),\n        rgba(255,255,255,.10);\n      box-shadow:\n        0 0 0 1px rgba(140,255,111,.16) inset,\n        0 0 28px rgba(168, 76, 255, .22);\n    }\n\n    .suit-btn.red .suit-symbol,\n    .rank-btn.red {\n      color: #ff5f8a;\n    }\n\n    .suit-btn.black .suit-symbol,\n    .rank-btn.black {\n      color: #e8e8ff;\n    }\n\n    .range-row {\n      display: grid;\n      grid-template-columns: 1fr 64px;\n      gap: 12px;\n      align-items: center;\n    }\n\n    input[type=\"range\"] {\n      accent-color: var(--gold);\n      padding: 0;\n      min-height: auto;\n      border: none;\n      background: transparent;\n    }\n\n    .value-badge {\n      height: 36px;\n      border-radius: 999px;\n      display: grid;\n      place-items: center;\n      background: rgba(247, 212, 123, .12);\n      border: 1px solid rgba(247, 212, 123, .28);\n      color: var(--gold);\n      font-weight: 900;\n      font-size: 13px;\n    }\n\n    .help {\n      margin: 8px 0 0;\n      color: var(--muted);\n      font-size: 12px;\n      line-height: 1.65;\n    }\n\n    .output-tools {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 10px;\n      margin-top: 12px;\n    }\n\n    .primary-btn,\n    .secondary-btn {\n      border: none;\n      border-radius: 14px;\n      min-height: 46px;\n      padding: 0 16px;\n      color: #1a1022;\n      font-family: inherit;\n      font-weight: 900;\n      cursor: pointer;\n      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;\n    }\n\n    .primary-btn {\n      background: linear-gradient(135deg, #fff1b6, #f7d47b 40%, #ff78b6 100%);\n      box-shadow: 0 14px 30px rgba(247, 212, 123, .20);\n    }\n\n    .secondary-btn {\n      color: var(--text);\n      border: 1px solid rgba(255,255,255,.18);\n      background: rgba(255,255,255,.08);\n    }\n\n    .primary-btn:hover,\n    .secondary-btn:hover {\n      transform: translateY(-2px);\n      filter: brightness(1.04);\n    }\n\n    .toast {\n      position: fixed;\n      right: 18px;\n      bottom: 18px;\n      padding: 14px 16px;\n      border-radius: 16px;\n      background: rgba(10, 7, 16, .88);\n      color: var(--text);\n      border: 1px solid rgba(247, 212, 123, .38);\n      box-shadow: 0 18px 50px rgba(0,0,0,.35);\n      transform: translateY(20px);\n      opacity: 0;\n      pointer-events: none;\n      transition: opacity .2s ease, transform .2s ease;\n      z-index: 50;\n    }\n\n    .toast.show {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n    .footer-note {\n      margin: 18px 4px 0;\n      color: rgba(255, 247, 236, .55);\n      font-size: 12px;\n      line-height: 1.7;\n      text-align: center;\n    }\n\n    @media (max-width: 720px) {\n      .shell {\n        width: min(100% - 20px, 1100px);\n        padding-top: 10px;\n      }\n\n      .hero,\n      .panel-body,\n      .control-block {\n        padding: 16px;\n      }\n\n      .grid-2,\n      .grid-3,\n      .chip-grid {\n        grid-template-columns: 1fr;\n      }\n\n      .suit-buttons {\n        grid-template-columns: repeat(2, 1fr);\n      }\n\n      .rank-grid {\n        grid-template-columns: repeat(4, 1fr);\n      }\n\n      .output-tools {\n        display: grid;\n        grid-template-columns: 1fr;\n      }\n\n      .primary-btn,\n      .secondary-btn {\n        width: 100%;\n      }\n    }\n\n    @media (max-width: 460px) {\n      .rank-grid {\n        grid-template-columns: repeat(3, 1fr);\n      }\n    }\n  </style>\n</head>\n\n<body>\n  <main class=\"shell\">\n    <section class=\"hero\" aria-label=\"ツール概要\">\n      <div class=\"hero-content\">\n        <div class=\"badge\">✦ Luxury Prompt Builder</div>\n        <h1>\n          <span class=\"gradient-text\">Instagram風トランプカード</span><br>\n          プロンプト補助ツール\n        </h1>\n      </div>\n    </section>\n\n    <section class=\"layout\">\n      <div class=\"panel\">\n        <div class=\"panel-header\">\n          <h2>Prompt Settings</h2>\n          <span>選択すると即時反映</span>\n        </div>\n\n        <div class=\"panel-body\">\n          <div class=\"control-block\">\n            <h3 class=\"section-title\">Card Identity</h3>\n\n            <div class=\"grid-2\">\n              <div>\n                <label for=\"topName\">上部に入れる名前</label>\n                <input\n                  id=\"topName\"\n                  type=\"text\"\n                  value=\"名前\"\n                  placeholder=\"例: Natsumi Ichinose\"\n                  autocomplete=\"off\"\n                />\n              </div>\n\n              <div>\n                <label for=\"bottomText\">下部に入れる文字</label>\n                <input\n                  id=\"bottomText\"\n                  type=\"text\"\n                  value=\"bijo/Lier\"\n                  placeholder=\"例: bijo/Lier\"\n                  autocomplete=\"off\"\n                />\n              </div>\n            </div>\n\n            <p class=\"help\">上部の名前は、完成カードの主役テキストとして煌びやかに入る想定です。</p>\n          </div>\n\n          <div class=\"control-block\">\n            <h3 class=\"section-title\">Suit</h3>\n\n            <div class=\"suit-buttons\" role=\"group\" aria-label=\"トランプのマーク\">\n              <button class=\"suit-btn red active\" type=\"button\" data-suit=\"ハート\" data-symbol=\"♥\" data-color=\"red\">\n                <span class=\"suit-symbol\">♥</span>\n                <span class=\"suit-label\">ハート</span>\n              </button>\n\n              <button class=\"suit-btn black\" type=\"button\" data-suit=\"クラブ\" data-symbol=\"♣\" data-color=\"black\">\n                <span class=\"suit-symbol\">♣</span>\n                <span class=\"suit-label\">クラブ</span>\n              </button>\n\n              <button class=\"suit-btn red\" type=\"button\" data-suit=\"ダイヤ\" data-symbol=\"♦\" data-color=\"red\">\n                <span class=\"suit-symbol\">♦</span>\n                <span class=\"suit-label\">ダイヤ</span>\n              </button>\n\n              <button class=\"suit-btn black\" type=\"button\" data-suit=\"スペード\" data-symbol=\"♠\" data-color=\"black\">\n                <span class=\"suit-symbol\">♠</span>\n                <span class=\"suit-label\">スペード</span>\n              </button>\n            </div>\n\n            <p class=\"help\">※ ジョーカー選択時は、スート選択はプロンプトに反映されません。</p>\n          </div>\n\n          <div class=\"control-block\">\n            <h3 class=\"section-title\">Rank</h3>\n\n            <div class=\"rank-grid\" role=\"group\" aria-label=\"ランク\">\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"1\">1</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"2\">2</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"3\">3</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"4\">4</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"5\">5</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"6\">6</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"7\">7</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"8\">8</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"9\">9</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"10\">10</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"ジャック\">J</button>\n              <button class=\"rank-btn red active\" type=\"button\" data-rank=\"クイーン\">Q</button>\n              <button class=\"rank-btn red\" type=\"button\" data-rank=\"キング\">K</button>\n              <button class=\"rank-btn joker-btn\" type=\"button\" data-rank=\"ジョーカー\">JOKER</button>\n            </div>\n\n            <div id=\"jokerNotice\" class=\"joker-notice\">\n              ジョーカー選択中です。<br>\n              縁の質感・カラー・背景は固定されます。<br>\n              固定内容：<br>\n              ・縁：グリーンとムラサキのミックス<br>\n              ・背景：漆黒の空に雷が鳴り響いているシーン<br>\n              ・衣装：奇抜なカラーの道化師のコスプレ\n            </div>\n          </div>\n\n          <div id=\"edgeBlock\" class=\"control-block joker-lock-target\">\n            <h3 class=\"section-title\">Trump Edge</h3>\n\n            <div class=\"grid-3\">\n              <div>\n                <label for=\"edgeMaterial\">縁の質感</label>\n                <select id=\"edgeMaterial\">\n                  <option value=\"重厚なゴールドメタリック\">ゴールドメタリック</option>\n                  <option value=\"鏡面のシルバーメタリック\">シルバーメタリック</option>\n                  <option value=\"上品なマット質感\">マット</option>\n                  <option value=\"高級感のあるローズゴールド\">ローズゴールド</option>\n                  <option value=\"透明感のあるクリスタル風\">クリスタル風</option>\n                  <option value=\"黒金のラグジュアリー質感\">黒金ラグジュアリー</option>\n                  <option value=\"オーロラに輝くホログラム質感\">オーロラホログラム</option>\n                </select>\n              </div>\n\n              <div>\n                <label for=\"edgeColorPreset\">縁カラー</label>\n                <select id=\"edgeColorPreset\">\n                  <option value=\"ゴールド\">ゴールド</option>\n                  <option value=\"ピンクゴールド\">ピンクゴールド</option>\n                  <option value=\"シャンパンゴールド\">シャンパンゴールド</option>\n                  <option value=\"シルバー\">シルバー</option>\n                  <option value=\"ブラック\">ブラック</option>\n                  <option value=\"ホワイト\">ホワイト</option>\n                  <option value=\"レッド\">レッド</option>\n                  <option value=\"ロイヤルブルー\">ロイヤルブルー</option>\n                  <option value=\"パープル\">パープル</option>\n                  <option value=\"オーロラ\">オーロラ</option>\n                  <option value=\"カスタムカラー\">カスタムカラー</option>\n                </select>\n              </div>\n\n              <div>\n                <label for=\"edgeCustomColor\">カスタム色</label>\n                <input id=\"edgeCustomColor\" type=\"color\" value=\"#d4af37\" />\n              </div>\n            </div>\n\n            <p class=\"help\">「カスタムカラー」を選ぶと、カラーコードもプロンプトへ入ります。</p>\n          </div>\n\n          <div id=\"backgroundBlock\" class=\"control-block joker-lock-target\">\n            <h3 class=\"section-title\">Background Mood</h3>\n\n            <div class=\"grid-2\">\n              <div>\n                <label for=\"backgroundStyle\">背景スタイル</label>\n                <select id=\"backgroundStyle\">\n                  <option value=\"真っ白で清潔感のあるミニマル背景\">真っ白</option>\n                  <option value=\"可愛いパステルカラーのふんわりした背景\">可愛い系</option>\n                  <option value=\"宝石のように煌びやかな光が舞う背景\">煌びやか</option>\n                  <option value=\"黒を基調にしたシックでかっこいい背景\">シックでかっこいい</option>\n                  <option value=\"神秘的な光と粒子が漂う幻想的な背景\">幻想的</option>\n                  <option value=\"高級ホテルラウンジのようなラグジュアリー背景\">ラグジュアリー</option>\n                  <option value=\"Instagramカラーのネオンが輝くSNS風背景\">Instagramネオン</option>\n                  <option value=\"映画ポスターのようなドラマチックな背景\">シネマティック</option>\n                </select>\n              </div>\n\n              <div>\n                <label for=\"backgroundBrightness\">明るさ・印象</label>\n                <select id=\"backgroundBrightness\">\n                  <option value=\"明るく華やか\">明るく華やか</option>\n                  <option value=\"白く透明感がある\">白く透明感がある</option>\n                  <option value=\"可愛く甘い雰囲気\">可愛く甘い雰囲気</option>\n                  <option value=\"強いコントラストでかっこいい\">強いコントラストでかっこいい</option>\n                  <option value=\"落ち着いた大人っぽい雰囲気\">落ち着いた大人っぽい雰囲気</option>\n                  <option value=\"豪華で眩しい雰囲気\">豪華で眩しい雰囲気</option>\n                </select>\n              </div>\n            </div>\n          </div>\n\n          <div class=\"control-block\">\n            <h3 class=\"section-title\">Decoration Control</h3>\n\n            <div class=\"grid-2\">\n              <div>\n                <label for=\"motifAmount\">Instagramモチーフ量</label>\n                <div class=\"range-row\">\n                  <input id=\"motifAmount\" type=\"range\" min=\"1\" max=\"5\" value=\"4\" />\n                  <div id=\"motifAmountValue\" class=\"value-badge\">4</div>\n                </div>\n                <p class=\"help\">1=控えめ、5=かなり多め</p>\n              </div>\n\n              <div>\n                <label for=\"perspectivePower\">3Dパースの強さ</label>\n                <div class=\"range-row\">\n                  <input id=\"perspectivePower\" type=\"range\" min=\"1\" max=\"5\" value=\"5\" />\n                  <div id=\"perspectivePowerValue\" class=\"value-badge\">5</div>\n                </div>\n                <p class=\"help\">5に近いほど飛び出し感を強調します。</p>\n              </div>\n            </div>\n\n            <div style=\"height: 14px;\"></div>\n\n            <div class=\"chip-grid\" role=\"group\" aria-label=\"プロンプト出力モード\">\n              <button class=\"chip-btn active\" type=\"button\" data-mode=\"detail\">詳細版</button>\n              <button class=\"chip-btn\" type=\"button\" data-mode=\"short\">短め版</button>\n              <button class=\"chip-btn\" type=\"button\" data-mode=\"strict\">厳守強化版</button>\n            </div>\n          </div>\n\n          <div class=\"control-block\">\n            <h3 class=\"section-title\">Generated Prompt</h3>\n\n            <textarea id=\"promptOutput\" spellcheck=\"false\"></textarea>\n\n            <div class=\"output-tools\">\n              <button id=\"copyBtn\" class=\"primary-btn\" type=\"button\">プロンプトをコピー</button>\n              <button id=\"selectBtn\" class=\"secondary-btn\" type=\"button\">全文選択</button>\n              <button id=\"resetBtn\" class=\"secondary-btn\" type=\"button\">初期値に戻す</button>\n            </div>\n          </div>\n        </div>\n      </div>\n    </section>\n\n    <p class=\"footer-note\">\n      このHTMLは1ファイルで動作します。保存してブラウザで開けば、プロンプト生成ツールとして使用できます。\n    </p>\n  </main>\n\n  <div id=\"toast\" class=\"toast\">コピーしました</div>\n\n  <script>\n    const state = {\n      suit: \"ハート\",\n      suitSymbol: \"♥\",\n      suitColor: \"red\",\n      rank: \"クイーン\",\n      mode: \"detail\"\n    };\n\n    const els = {\n      topName: document.getElementById(\"topName\"),\n      bottomText: document.getElementById(\"bottomText\"),\n      edgeMaterial: document.getElementById(\"edgeMaterial\"),\n      edgeColorPreset: document.getElementById(\"edgeColorPreset\"),\n      edgeCustomColor: document.getElementById(\"edgeCustomColor\"),\n      backgroundStyle: document.getElementById(\"backgroundStyle\"),\n      backgroundBrightness: document.getElementById(\"backgroundBrightness\"),\n      motifAmount: document.getElementById(\"motifAmount\"),\n      perspectivePower: document.getElementById(\"perspectivePower\"),\n      motifAmountValue: document.getElementById(\"motifAmountValue\"),\n      perspectivePowerValue: document.getElementById(\"perspectivePowerValue\"),\n      promptOutput: document.getElementById(\"promptOutput\"),\n      toast: document.getElementById(\"toast\"),\n      jokerNotice: document.getElementById(\"jokerNotice\"),\n      edgeBlock: document.getElementById(\"edgeBlock\"),\n      backgroundBlock: document.getElementById(\"backgroundBlock\")\n    };\n\n    function isJokerSelected() {\n      return state.rank === \"ジョーカー\";\n    }\n\n    function getEdgeColorText() {\n      const preset = els.edgeColorPreset.value;\n\n      if (preset === \"カスタムカラー\") {\n        return `カスタムカラー（${els.edgeCustomColor.value}）`;\n      }\n\n      return preset;\n    }\n\n    function getMotifText(value) {\n      const map = {\n        1: \"控えめに数個だけ配置\",\n        2: \"少なめに上品に配置\",\n        3: \"適度な量でバランスよく配置\",\n        4: \"多めに華やかに配置\",\n        5: \"大量に飛び出す豪華なコラージュとして配置\"\n      };\n\n      return map[value] || map[4];\n    }\n\n    function getPerspectiveText(value) {\n      const map = {\n        1: \"軽めの立体感\",\n        2: \"自然な奥行き感\",\n        3: \"しっかりした3Dパース\",\n        4: \"かなり強い3Dパース\",\n        5: \"極端な3Dパースペクティブ\"\n      };\n\n      return map[value] || map[5];\n    }\n\n    function updateJokerMode() {\n      const joker = isJokerSelected();\n\n      [\n        els.edgeMaterial,\n        els.edgeColorPreset,\n        els.edgeCustomColor,\n        els.backgroundStyle,\n        els.backgroundBrightness\n      ].forEach(el => {\n        el.disabled = joker;\n      });\n\n      els.edgeBlock.classList.toggle(\"locked\", joker);\n      els.backgroundBlock.classList.toggle(\"locked\", joker);\n      els.jokerNotice.classList.toggle(\"show\", joker);\n    }\n\n    function generatePrompt() {\n      const name = els.topName.value.trim() || \"名前\";\n      const bottom = els.bottomText.value.trim() || \"bijo/Lier\";\n      const motifText = getMotifText(els.motifAmount.value);\n      const perspectiveText = getPerspectiveText(els.perspectivePower.value);\n\n      let prompt = \"\";\n\n      if (isJokerSelected()) {\n        const jokerBase = `アップロードされた画像を使って、超リアルなSNSの\"Instagram\"をモチーフにしたジョーカーカードを作成してください。トランプはジョーカー。トランプカード自体は2Dの平面イラストとして描かれ、その中からアップロードされた画像の人物が立体的に飛び出してくる構図。トランプを破いて飛び出すのではなく、InstagramのロゴやInstagramに関するモチーフ（いいね、リポスト、カメラ、吹き出し、通知アイコン、ハート、トランプに関するモチーフ）が大小さまざまな大きさで空間に飛び出すコラージュ画像。`;\n\n        const jokerDesign = `トランプ本体のメインカラーは白。トランプの縁は妖しく艶めくメタリック質感で固定し、カラーはグリーンとムラサキのミックスで固定。カード全体は高級感があり、細部まで精密で、光沢・反射・陰影が美しく、完成度の高いプレミアムデザイン。トランプの上部分に「${name}」の文字を煌びやかに入れる。トランプの下部分には「${bottom}」の文字を入れる。文字はカードの雰囲気に合わせた高級感のあるデザインで、読みやすく美しく配置する。`;\n\n        const jokerComposition = `${perspectiveText}をつけ、カードから人物が現れる奥行き感を強調。人物の顔立ち、表情、髪型、雰囲気は元画像にできるだけ忠実に保ちながら、衣装は奇抜なカラーの道化師のコスプレに変更する。Instagramモチーフは${motifText}。完成したカードを、漆黒の空に雷が鳴り響いているシーンの中に配置する。カードの端が1点だけ設置しているように見せ、設置点には美しいドロップシャドウを入れる。アスペクト比は3:4。マスターピース、超高精細、豪華、立体的、シネマティック、フォトリアル、8k品質。`;\n\n        const jokerStrict = `【厳守】カードは必ずジョーカーカードにする。人物の顔・髪型・雰囲気は元画像に忠実に保つ。衣装は必ず奇抜なカラーの道化師のコスプレにする。トランプ本体のメインカラーは必ず白。縁のカラーは必ずグリーンとムラサキのミックス。背景は必ず漆黒の空に雷が鳴り響いているシーン。カードは破かない。人物はカードの中から飛び出しているように見せる。文字「${name}」と「${bottom}」は必ず入れる。アスペクト比は必ず3:4。`;\n\n        if (state.mode === \"short\") {\n          prompt = `${jokerBase} ${jokerDesign} ${jokerComposition}`;\n        } else if (state.mode === \"strict\") {\n          prompt = `${jokerStrict}\\n\\n${jokerBase}\\n\\n${jokerDesign}\\n\\n${jokerComposition}`;\n        } else {\n          prompt = `${jokerBase}\\n\\n${jokerDesign}\\n\\n${jokerComposition}`;\n        }\n      } else {\n        const edgeMaterial = els.edgeMaterial.value;\n        const edgeColor = getEdgeColorText();\n        const bgStyle = els.backgroundStyle.value;\n        const bgBrightness = els.backgroundBrightness.value;\n\n        const base = `アップロードされた画像を使って、超リアルなSNSの\"Instagram\"をモチーフにしたトランプカードを作成してください。トランプのマークは${state.suit}の${state.rank}。トランプカード自体は2Dの平面イラストとして描かれ、その中からアップロードされた画像の人物が立体的に飛び出してくる構図。トランプを破いて飛び出すのではなく、InstagramのロゴやInstagramに関するモチーフ（いいね、リポスト、カメラ、吹き出し、通知アイコン、ハート、トランプに関するモチーフ）が大小さまざまな大きさで空間に飛び出すコラージュ画像。`;\n\n        const design = `トランプ本体のメインカラーは白。トランプの縁は${edgeMaterial}な質感で、カラーは${edgeColor}。カード全体は高級感があり、細部まで精密で、光沢・反射・陰影が美しく、完成度の高いプレミアムデザイン。トランプの上部分に「${name}」の文字を煌びやかに入れる。トランプの下部分には「${bottom}」の文字を入れる。文字はカードの雰囲気に合わせた高級感のあるデザインで、読みやすく美しく配置する。`;\n\n        const composition = `${perspectiveText}をつけ、カードから人物が現れる奥行き感を強調。アップロードされた画像の人物のポーズ、表情、服装、髪型、雰囲気はできるだけ変更しないこと。Instagramモチーフは${motifText}。完成したカードを${bgStyle}、${bgBrightness}な空間の中に配置する。カードの端が1点だけ設置しているように見せ、設置点には美しいドロップシャドウを入れる。アスペクト比は3:4。マスターピース、超高精細、豪華、立体的、シネマティック、フォトリアル、8k品質。`;\n\n        const strict = `【厳守】人物のポーズは変更しない。人物の顔・髪型・服装・雰囲気を元画像に忠実に保つ。トランプ本体のメインカラーは必ず白。カードは破かない。人物はカードの中から飛び出しているように見せる。文字「${name}」と「${bottom}」は必ず入れる。トランプのマークは必ず${state.suit}の${state.rank}。背景は${bgStyle}。アスペクト比は必ず3:4。`;\n\n        if (state.mode === \"short\") {\n          prompt = `${base} ${design} ${composition}`;\n        } else if (state.mode === \"strict\") {\n          prompt = `${strict}\\n\\n${base}\\n\\n${design}\\n\\n${composition}`;\n        } else {\n          prompt = `${base}\\n\\n${design}\\n\\n${composition}`;\n        }\n      }\n\n      els.promptOutput.value = prompt;\n      els.motifAmountValue.textContent = els.motifAmount.value;\n      els.perspectivePowerValue.textContent = els.perspectivePower.value;\n    }\n\n    function showToast(text) {\n      els.toast.textContent = text;\n      els.toast.classList.add(\"show\");\n\n      window.setTimeout(() => {\n        els.toast.classList.remove(\"show\");\n      }, 1500);\n    }\n\n    document.querySelectorAll(\".suit-btn\").forEach(button => {\n      button.addEventListener(\"click\", () => {\n        document.querySelectorAll(\".suit-btn\").forEach(b => b.classList.remove(\"active\"));\n        button.classList.add(\"active\");\n\n        state.suit = button.dataset.suit;\n        state.suitSymbol = button.dataset.symbol;\n        state.suitColor = button.dataset.color;\n\n        document.querySelectorAll(\".rank-btn\").forEach(b => {\n          if (!b.classList.contains(\"joker-btn\")) {\n            b.classList.toggle(\"red\", state.suitColor === \"red\");\n            b.classList.toggle(\"black\", state.suitColor === \"black\");\n          }\n        });\n\n        generatePrompt();\n      });\n    });\n\n    document.querySelectorAll(\".rank-btn\").forEach(button => {\n      button.addEventListener(\"click\", () => {\n        document.querySelectorAll(\".rank-btn\").forEach(b => b.classList.remove(\"active\"));\n        button.classList.add(\"active\");\n\n        state.rank = button.dataset.rank;\n\n        updateJokerMode();\n        generatePrompt();\n      });\n    });\n\n    document.querySelectorAll(\".chip-btn\").forEach(button => {\n      button.addEventListener(\"click\", () => {\n        document.querySelectorAll(\".chip-btn\").forEach(b => b.classList.remove(\"active\"));\n        button.classList.add(\"active\");\n\n        state.mode = button.dataset.mode;\n\n        generatePrompt();\n      });\n    });\n\n    [\n      els.topName,\n      els.bottomText,\n      els.edgeMaterial,\n      els.edgeColorPreset,\n      els.edgeCustomColor,\n      els.backgroundStyle,\n      els.backgroundBrightness,\n      els.motifAmount,\n      els.perspectivePower\n    ].forEach(el => {\n      el.addEventListener(\"input\", generatePrompt);\n      el.addEventListener(\"change\", generatePrompt);\n    });\n\n    document.getElementById(\"copyBtn\").addEventListener(\"click\", async () => {\n      try {\n        await navigator.clipboard.writeText(els.promptOutput.value);\n        showToast(\"プロンプトをコピーしました\");\n      } catch (e) {\n        els.promptOutput.select();\n        document.execCommand(\"copy\");\n        showToast(\"プロンプトをコピーしました\");\n      }\n    });\n\n    document.getElementById(\"selectBtn\").addEventListener(\"click\", () => {\n      els.promptOutput.focus();\n      els.promptOutput.select();\n      showToast(\"全文を選択しました\");\n    });\n\n    document.getElementById(\"resetBtn\").addEventListener(\"click\", () => {\n      state.suit = \"ハート\";\n      state.suitSymbol = \"♥\";\n      state.suitColor = \"red\";\n      state.rank = \"クイーン\";\n      state.mode = \"detail\";\n\n      els.topName.value = \"名前\";\n      els.bottomText.value = \"bijo/Lier\";\n      els.edgeMaterial.value = \"重厚なゴールドメタリック\";\n      els.edgeColorPreset.value = \"ゴールド\";\n      els.edgeCustomColor.value = \"#d4af37\";\n      els.backgroundStyle.value = \"真っ白で清潔感のあるミニマル背景\";\n      els.backgroundBrightness.value = \"明るく華やか\";\n      els.motifAmount.value = \"4\";\n      els.perspectivePower.value = \"5\";\n\n      document.querySelectorAll(\".suit-btn\").forEach(b => b.classList.remove(\"active\"));\n      document.querySelector('[data-suit=\"ハート\"]').classList.add(\"active\");\n\n      document.querySelectorAll(\".rank-btn\").forEach(b => b.classList.remove(\"active\"));\n      document.querySelector('[data-rank=\"クイーン\"]').classList.add(\"active\");\n\n      document.querySelectorAll(\".chip-btn\").forEach(b => b.classList.remove(\"active\"));\n      document.querySelector('[data-mode=\"detail\"]').classList.add(\"active\");\n\n      document.querySelectorAll(\".rank-btn\").forEach(b => {\n        if (!b.classList.contains(\"joker-btn\")) {\n          b.classList.remove(\"black\");\n          b.classList.add(\"red\");\n        }\n      });\n\n      updateJokerMode();\n      generatePrompt();\n      showToast(\"初期値に戻しました\");\n    });\n\n    updateJokerMode();\n    generatePrompt();\n  <\/script>\n</body>\n</html>"
    }
  ]
};
    // --- DATA_END ---

    const STORAGE_KEY = 'tashi_html_tools_v3';
    let localData = JSON.parse(localStorage.getItem(STORAGE_KEY));
    let currentData = APP_DATA;

    if (localData && localData.lastModified > APP_DATA.lastModified) {
      currentData = localData;
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(APP_DATA));
    }

    let currentEditId = null;

    const grid = document.getElementById('tool-grid');
    const modeToggle = document.getElementById('mode-toggle');
    const modeLabel = document.getElementById('mode-label');
    const body = document.body;

    // ★修正箇所：パスワード入力の判定タイミングを安全な形に変更しました
    modeToggle.addEventListener('click', (e) => {
      if (modeToggle.checked) {
        // 閲覧モードから編集モードへ（スイッチがONになろうとした時）
        const entered = prompt("編集モードのパスワードを入力してください:");
        if (entered === currentData.password) {
          // パスワードが合っていれば編集モードを有効化
          body.classList.add('edit-mode');
          modeLabel.innerText = '編集モード';
          modeLabel.style.color = 'var(--danger)';
          renderGrid();
        } else {
          // キャンセル、またはパスワード間違いの場合はスイッチを元に戻す
          e.preventDefault(); 
          if (entered !== null) {
            alert("パスワードが違います。");
          }
        }
      } else {
        // 編集モードから閲覧モードへ戻す時
        body.classList.remove('edit-mode');
        modeLabel.innerText = '閲覧モード';
        modeLabel.style.color = 'var(--text-main)';
        renderGrid();
      }
    });

    function changePassword() {
      const oldPw = prompt("現在のパスワードを入力してください:");
      if (oldPw === currentData.password) {
        const newPw = prompt("新しいパスワードを入力してください:");
        if (newPw) {
          currentData.password = newPw;
          saveData();
          alert("パスワードを変更しました。");
        }
      } else if (oldPw !== null) {
        alert("現在のパスワードが違います。");
      }
    }

    function exportHTML() {
      const clone = document.documentElement.cloneNode(true);

      clone.querySelector('#tool-grid').innerHTML = ''; 
      clone.querySelector('body').classList.remove('edit-mode');
      clone.querySelector('#mode-toggle').checked = false;
      clone.querySelector('#mode-label').innerText = '閲覧モード';
      clone.querySelector('#mode-label').style.color = 'var(--text-main)';
      
      const overlay = clone.querySelector('#editor-overlay');
      if(overlay) overlay.classList.remove('active');
      const viewer = clone.querySelector('#viewer-modal');
      if(viewer) viewer.classList.remove('active');
      clone.querySelector('#viewer-frame').srcdoc = '';

      currentData.lastModified = Date.now();
      saveData();

      const scriptTag = clone.querySelector('#main-script');
      const dataRegex = /\/\/ --- DATA_START ---[\s\S]*?\/\/ --- DATA_END ---/;
      
      const jsonString = JSON.stringify(currentData, null, 2).split('</scr' + 'ipt>').join('<\\/scr' + 'ipt>');
      const newDataBlock = `// --- DATA_START ---\n    const APP_DATA = ${jsonString};\n    // --- DATA_END ---`;
      
      scriptTag.innerHTML = scriptTag.innerHTML.replace(dataRegex, newDataBlock);

      const htmlContent = "<!DOCTYPE html>\n" + clone.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderGrid() {
      grid.innerHTML = '';
      currentData.tools.forEach((tool, index) => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.onclick = () => { if (!modeToggle.checked) openViewer(tool); };

        const title = document.createElement('div');
        title.className = 'tool-title';
        title.innerText = tool.title;
        card.appendChild(title);

        const controls = document.createElement('div');
        controls.className = 'edit-controls';
        controls.onclick = (e) => e.stopPropagation(); 

        controls.innerHTML = `
          <div class="control-row">
            <button class="btn btn-move" onclick="moveTool(${index}, -1)">◀</button>
            <button class="btn btn-move" onclick="moveTool(${index}, 1)">▶</button>
          </div>
          <div class="control-row">
            <button class="btn btn-edit" onclick="openEditor(${tool.id})">編集</button>
            <button class="btn btn-danger" onclick="deleteTool(${tool.id})">削除</button>
          </div>
        `;
        card.appendChild(controls);
        grid.appendChild(card);
      });

      const addCard = document.createElement('div');
      addCard.className = 'tool-card add-card';
      addCard.innerText = '+';
      addCard.onclick = () => openEditor(null);
      grid.appendChild(addCard);
    }

    function openViewer(tool) {
      document.getElementById('viewer-title').innerText = tool.title;
      document.getElementById('viewer-frame').srcdoc = tool.htmlContent;
      document.getElementById('viewer-modal').classList.add('active');
    }

    function closeViewer() {
      document.getElementById('viewer-modal').classList.remove('active');
      setTimeout(() => { document.getElementById('viewer-frame').srcdoc = ''; }, 200);
    }

    function openEditor(id) {
      currentEditId = id;
      if (id) {
        const tool = currentData.tools.find(t => t.id === id);
        document.getElementById('tool-title').value = tool.title;
        document.getElementById('tool-html').value = tool.htmlContent;
      } else {
        document.getElementById('tool-title').value = '';
        document.getElementById('tool-html').value = '';
      }
      document.getElementById('editor-overlay').classList.add('active');
    }

    function closeEditor() {
      document.getElementById('editor-overlay').classList.remove('active');
      currentEditId = null;
    }

    function saveTool() {
      const title = document.getElementById('tool-title').value.trim();
      const htmlContent = document.getElementById('tool-html').value.trim();

      if (!title || !htmlContent) return alert('タイトルとHTMLソースコードを入力してください。');

      if (currentEditId) {
        const tool = currentData.tools.find(t => t.id === currentEditId);
        tool.title = title;
        tool.htmlContent = htmlContent;
      } else {
        currentData.tools.push({ id: Date.now(), title: title, htmlContent: htmlContent });
      }

      saveData();
      renderGrid();
      closeEditor();
    }

    function deleteTool(id) {
      if (confirm('このツールを削除してもよろしいですか？')) {
        currentData.tools = currentData.tools.filter(t => t.id !== id);
        saveData();
        renderGrid();
      }
    }

    function moveTool(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentData.tools.length) return;
      const temp = currentData.tools[index];
      currentData.tools[index] = currentData.tools[newIndex];
      currentData.tools[newIndex] = temp;
      saveData();
      renderGrid();
    }

    function saveData() {
      currentData.lastModified = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentData));
    }

    renderGrid();
  </script>


</body></html>
