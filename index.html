<!DOCTYPE html>
<html lang="ja"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Tools Portal</title>
  <style>
    /* 目に優しい柔らかなダークテーマ（Soft Dark） */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #f43f5e;
      --success: #10b981;
      --success-hover: #059669;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ヘッダー周り */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-buttons {
      display: none; /* 閲覧モードでは非表示 */
      gap: 10px;
    }

    body.edit-mode .header-buttons {
      display: flex;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--success);
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--danger);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* ボタン共通スタイル */
    .btn {
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-edit { background-color: var(--accent); }
    .btn-edit:hover { background-color: var(--accent-hover); }
    .btn-danger { background-color: var(--danger); }
    .btn-success { background-color: var(--success); }
    .btn-success:hover { background-color: var(--success-hover); }

    /* グリッドレイアウト */
    main {
      padding: 30px 5%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .tool-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 120px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .tool-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .tool-title {
      font-size: 1.1rem;
      font-weight: bold;
      word-break: break-word;
    }

    /* 編集モードコントロール */
    .edit-controls {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 12px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(2px);
    }

    body.edit-mode .tool-card .edit-controls {
      display: flex;
    }

    .control-row { display: flex; gap: 8px; }
    
    .btn-move { background-color: var(--card-hover); border: 1px solid var(--border); }
    .btn-move:hover { background-color: var(--text-muted); }

    .add-card {
      background-color: transparent;
      border: 2px dashed var(--border);
      color: var(--text-muted);
      font-size: 2rem;
      display: none;
    }
    body.edit-mode .add-card { display: flex; }
    .add-card:hover { border-color: var(--accent); color: var(--accent); }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .editor-modal {
      background: var(--card-bg);
      width: 90%;
      max-width: 800px;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .editor-modal input, .editor-modal textarea {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
    }

    .editor-modal textarea {
      height: 400px;
      resize: vertical;
      font-family: monospace;
    }

    .editor-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn-cancel { background-color: transparent; border: 1px solid var(--border); }

    /* 閲覧モード */
    .viewer-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      z-index: 200;
      flex-direction: column;
    }

    .viewer-modal.active { display: flex; }

    .viewer-header {
      background: var(--card-bg);
      color: var(--text-main);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .btn-back {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    iframe { width: 100%; flex-grow: 1; border: none; background: #ffffff; }
  </style>
</head>

    {

      "htmlContent": "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>画像生成プロンプト選択アシスタント</title>\n  <style>\n    :root {\n      --bg: #f7f3ff;\n      --card: rgba(255, 255, 255, 0.86);\n      --main: #7c3aed;\n      --main-dark: #5b21b6;\n      --accent: #ff6ec7;\n      --text: #231942;\n      --muted: #6b6680;\n      --line: rgba(124, 58, 237, 0.16);\n      --shadow: 0 18px 50px rgba(70, 35, 140, 0.18);\n      --radius: 22px;\n    }\n\n    * {\n      box-sizing: border-box;\n    }\n\n    body {\n      margin: 0;\n      font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n      color: var(--text);\n      background:\n        radial-gradient(circle at top left, rgba(255, 110, 199, 0.2), transparent 30%),\n        radial-gradient(circle at top right, rgba(124, 58, 237, 0.18), transparent 34%),\n        linear-gradient(135deg, #fff7fb 0%, #f7f3ff 45%, #eef7ff 100%);\n      min-height: 100vh;\n      padding: 18px;\n    }\n\n    .app {\n      width: min(1180px, 100%);\n      margin: 0 auto;\n    }\n\n    header {\n      margin-bottom: 16px;\n      padding: 18px 22px;\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      background: rgba(255, 255, 255, 0.72);\n      box-shadow: var(--shadow);\n      backdrop-filter: blur(18px);\n    }\n\n    h1 {\n      margin: 0;\n      font-size: clamp(24px, 3vw, 34px);\n      letter-spacing: -0.04em;\n      line-height: 1.15;\n    }\n\n    .layout {\n      display: grid;\n      grid-template-columns: minmax(0, 1.04fr) minmax(420px, 0.96fr);\n      gap: 16px;\n      align-items: start;\n    }\n\n    .panel {\n      background: var(--card);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: var(--shadow);\n      backdrop-filter: blur(18px);\n      overflow: hidden;\n    }\n\n    .panel-title {\n      padding: 13px 16px;\n      border-bottom: 1px solid var(--line);\n      background: linear-gradient(90deg, rgba(124, 58, 237, 0.1), rgba(255, 110, 199, 0.08));\n      font-weight: 800;\n      display: flex;\n      justify-content: space-between;\n      gap: 12px;\n      align-items: center;\n      font-size: 14px;\n    }\n\n    .panel-body {\n      padding: 16px;\n      display: flex;\n      flex-direction: column;\n      gap: 16px;\n    }\n\n    .grid-two {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 13px;\n      width: 100%;\n    }\n\n    .section.full {\n      width: 100%;\n    }\n\n    label.section-label {\n      display: block;\n      margin-bottom: 7px;\n      font-weight: 800;\n      font-size: 13px;\n      color: var(--main-dark);\n    }\n\n    textarea,\n    input[type=\"text\"] {\n      width: 100%;\n      border: 1px solid var(--line);\n      background: rgba(255, 255, 255, 0.92);\n      color: var(--text);\n      border-radius: 14px;\n      padding: 10px 12px;\n      font-size: 14px;\n      outline: none;\n      transition: 0.2s ease;\n    }\n\n    textarea:focus,\n    input[type=\"text\"]:focus {\n      border-color: rgba(124, 58, 237, 0.52);\n      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.09);\n    }\n\n    textarea {\n      min-height: 84px;\n      resize: vertical;\n      line-height: 1.65;\n    }\n\n    .chips {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\n      gap: 8px;\n    }\n\n    .chip {\n      position: relative;\n    }\n\n    .chip input {\n      position: absolute;\n      opacity: 0;\n      pointer-events: none;\n    }\n\n    .chip span {\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n      min-height: 36px;\n      padding: 8px 10px;\n      border: 1px solid var(--line);\n      border-radius: 999px;\n      background: rgba(255, 255, 255, 0.8);\n      color: var(--muted);\n      font-size: 12px;\n      font-weight: 700;\n      cursor: pointer;\n      transition: 0.2s ease;\n      user-select: none;\n      text-align: center;\n    }\n\n    .chip input:checked + span {\n      color: #fff;\n      border-color: transparent;\n      background: linear-gradient(135deg, var(--main), var(--accent));\n      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.24);\n    }\n\n    /* === 全項目共通のモーダルトリガーボタン === */\n    .category-buttons {\n      display: grid;\n      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n      gap: 12px;\n      margin-top: 6px;\n    }\n\n    .category-trigger {\n      background: rgba(255, 255, 255, 0.85);\n      border: 1px solid var(--line);\n      border-radius: 16px;\n      padding: 12px 16px;\n      text-align: left;\n      cursor: pointer;\n      transition: 0.2s ease;\n      display: flex;\n      flex-direction: column;\n      gap: 4px;\n      box-shadow: 0 4px 12px rgba(70, 35, 140, 0.04);\n      position: relative;\n    }\n\n    .category-trigger::after {\n      content: \"▼\";\n      position: absolute;\n      right: 16px;\n      top: 50%;\n      transform: translateY(-50%);\n      font-size: 10px;\n      color: var(--main);\n      opacity: 0.6;\n    }\n\n    .category-trigger:hover {\n      background: #fff;\n      border-color: rgba(124, 58, 237, 0.4);\n      transform: translateY(-2px);\n      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.08);\n    }\n\n    .category-trigger.active {\n      border-color: var(--main);\n      background: linear-gradient(135deg, rgba(124, 58, 237, 0.04), rgba(255, 110, 199, 0.02));\n      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.08);\n    }\n\n    .category-trigger-title {\n      font-size: 13.5px;\n      font-weight: 800;\n      color: var(--main-dark);\n    }\n\n    .category-trigger-desc {\n      font-size: 12px;\n      color: var(--text);\n      font-weight: 700;\n      white-space: nowrap;\n      overflow: hidden;\n      text-overflow: ellipsis;\n      width: 90%;\n    }\n\n    .category-trigger.theme-mode .category-trigger-title {\n      color: var(--text);\n    }\n    .category-trigger.theme-mode .category-trigger-desc {\n      color: var(--muted);\n      font-weight: normal;\n    }\n    .category-trigger.theme-mode.active .category-trigger-desc {\n      color: var(--main-dark);\n      font-weight: 700;\n    }\n\n    /* モーダル背景 */\n    .modal-overlay {\n      position: fixed;\n      top: 0;\n      left: 0;\n      width: 100%;\n      height: 100%;\n      background: rgba(20, 16, 34, 0.45);\n      backdrop-filter: blur(5px);\n      z-index: 1000;\n      display: none;\n      opacity: 0;\n      transition: opacity 0.25s ease;\n    }\n\n    .modal-overlay.show {\n      opacity: 1;\n    }\n\n    /* モーダル本体 */\n    .modal-box {\n      position: fixed;\n      top: 50%;\n      left: 50%;\n      transform: translate(-50%, -46%) scale(0.96);\n      width: min(640px, 92%);\n      max-height: 85vh;\n      background: rgba(255, 255, 255, 0.94);\n      border: 1px solid var(--line);\n      border-radius: var(--radius);\n      box-shadow: 0 24px 70px rgba(70, 35, 140, 0.25);\n      backdrop-filter: blur(24px);\n      z-index: 1001;\n      display: none;\n      opacity: 0;\n      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;\n      overflow-y: auto;\n    }\n\n    .modal-box.show {\n      opacity: 1;\n      transform: translate(-50%, -50%) scale(1);\n    }\n\n    .modal-header {\n      padding: 16px 20px;\n      border-bottom: 1px solid var(--line);\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      position: sticky;\n      top: 0;\n      background: rgba(255, 255, 255, 0.9);\n      backdrop-filter: blur(10px);\n      z-index: 2;\n    }\n\n    .modal-header h3 {\n      margin: 0;\n      font-size: 15px;\n      font-weight: 800;\n      color: var(--main-dark);\n    }\n\n    .modal-close-btn {\n      background: none !important;\n      border: none !important;\n      box-shadow: none !important;\n      color: \n\n    button {\n      appearance: none;\n      border: none;\n      border-radius: 999px;\n      padding: 10px 16px;\n      font-weight: 800;\n      cursor: pointer;\n      transition: 0.2s ease;\n      color: #fff;\n      background: linear-gradient(135deg, var(--main), var(--accent));\n      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.26);\n    }\n\n    button.secondary {\n      color: #eee7ff;\n      background: rgba(255, 255, 255, 0.12);\n      box-shadow: none;\n      border: 1px solid rgba(255, 255, 255, 0.14);\n    }\n\n    button:hover {\n      transform: translateY(-1px);\n      filter: brightness(1.04);\n    }\n\n    .toast {\n      position: fixed;\n      right: 22px;\n      bottom: 22px;\n      background: #141022;\n      color: #fff;\n      padding: 12px 16px;\n      border-radius: 999px;\n      box-shadow: var(--shadow);\n      opacity: 0;\n      transform: translateY(8px);\n      pointer-events: none;\n      transition: 0.25s ease;\n      font-weight: 800;\n      font-size: 14px;\n    }\n\n    .toast.show {\n      opacity: 1;\n      transform: translateY(0);\n    }\n\n    @media (max-width: 980px) {\n      body {\n        padding: 14px;\n      }\n      .layout {\n        grid-template-columns: 1fr;\n      }\n      .prompt-output {\n        min-height: 430px;\n      }\n    }\n    \n    @media (max-width: 600px) {\n      .grid-two, .radio-grid {\n        grid-template-columns: 1fr;\n      }\n    }\n  </style>\n</head>\n<body>\n  <div class=\"app\">\n    <header>\n      <h1>画像生成プロンプト選択アシスタント</h1>\n    </header>\n\n    <main class=\"layout\">\n      <section class=\"panel\">\n        <div class=\"panel-title\">\n          <span>選択パネル</span>\n          <span>Prompt Builder</span>\n        </div>\n        <div class=\"panel-body\">\n          \n          <div class=\"grid-two\">\n            <div class=\"category-trigger\" data-target=\"modal-aspectRatio\">\n              <span class=\"category-trigger-title\">アスペクト比</span>\n              <span class=\"category-trigger-desc\">3:4｜縦長・人物向け</span>\n            </div>\n            <div class=\"category-trigger\" data-target=\"modal-framing\">\n              <span class=\"category-trigger-title\">構図</span>\n              <span class=\"category-trigger-desc\">胸から上・上半身</span>\n            </div>\n          </div>\n\n          <div class=\"grid-two\">\n            <div class=\"category-trigger\" data-target=\"modal-dimension\">\n              <span class=\"category-trigger-title\">2D / 3D</span>\n              <span class=\"category-trigger-desc\">3D</span>\n            </div>\n            <div class=\"category-trigger\" data-target=\"modal-personStyle\">\n              <span class=\"category-trigger-title\">人物スタイル</span>\n              <span class=\"category-trigger-desc\">3Dふわふわファッションドール</span>\n            </div>\n          </div>\n\n          <div class=\"section full\">\n            <label class=\"section-label\">ふわふわドール要素</label>\n            <div class=\"chips\" data-checkbox-group>\n              <label class=\"chip\">\n                <input type=\"checkbox\" name=\"fluffy\" value=\"アップロードした人物に基づいて作られた、プレミアムなスタイル化された3Dふわふわファッションドールのように描く。\" checked />\n                <span>プレミアム3Dふわふわドール</span>\n              </label>\n              <label class=\"chip\">\n                <input type=\"checkbox\" name=\"fluffy\" value=\"強い似せ方を保ち、参照画像の顔立ち、髪型、髪色、前髪、年齢感、雰囲気を明確に残す。\" checked />\n                <span>強い似せ方</span>\n              </label>\n              <label class=\"chip\">\n                <input type=\"checkbox\" name=\"fluffy\" value=\"リアルな人間やセミリアルCGではなく、完全にカートゥーン調のふわふわキャラクター世界にする。\" checked />\n                <span>完全カートゥーン世界</span>\n              </label>\n              <label class=\"chip\">\n                <input type=\"checkbox\" name=\"fluffy\" value=\"髪はリアルな細い毛束ではなく、なめらかで艶のある大きなまとまりの3Dドールヘアにする。\" checked />\n                <span>なめらかドールヘア</span>\n              </label>\n              <label class=\"chip\">\n                <input type=\"checkbox\" name=\"fluffy\" value=\"肌、衣装、背景はぬいぐるみのように柔らかく、丸みのある可愛い質感で統一する。\" />\n                <span>ぬいぐるみ質感</span>\n              </label>\n            </div>\n          </div>\n\n          <div class=\"section full\">\n            <label class=\"section-label\">世界観テーマ</label>\n            <div class=\"category-buttons\">\n              <div class=\"category-trigger theme-mode\" data-target=\"modal-fantasy\">\n                <span class=\"category-trigger-title\">✨ 幻想・ファンタジー</span>\n                <span class=\"category-trigger-desc\">未選択</span>\n              </div>\n              <div class=\"category-trigger theme-mode\" data-target=\"modal-reshape\">\n                <span class=\"category-trigger-title\">🌀 変化・再構築</span>\n                <span class=\"category-trigger-desc\">未選択</span>\n              </div>\n              <div class=\"category-trigger theme-mode\" data-target=\"modal-future\">\n                <span class=\"category-trigger-title\">🔮 未来・概念・不思議</span>\n                <span class=\"category-trigger-desc\">未選択</span>\n              </div>\n            </div>\n          </div>\n\n          <div class=\"grid-two\">\n            <div class=\"category-trigger\" data-target=\"modal-mediaEffect\">\n              <span class=\"category-trigger-title\">媒体演出</span>\n              <span class=\"category-trigger-desc\">なし</span>\n            </div>\n            <div class=\"category-trigger\" data-target=\"modal-mood\">\n              <span class=\"category-trigger-title\">雰囲気</span>\n              <span class=\"category-trigger-desc\">可愛い・明るい</span>\n            </div>\n          </div>\n\n          <div class=\"grid-two\">\n            <div class=\"category-trigger\" data-target=\"modal-lighting\">\n              <span class=\"category-trigger-title\">光・質感</span>\n              <span class=\"category-trigger-desc\">シネマティック光</span>\n            </div>\n          </div>\n\n          <div class=\"section full\">\n            <label class=\"section-label\">強調したい追加要素</label>\n            <div class=\"chips\" data-checkbox-group>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"大きく輝く瞳、丸い頬、小さな鼻と口を可愛く表現する。\" /><span>大きな瞳</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"背景に星、ハート、リボン、花、光の軌跡を浮かべる。\" /><span>星・ハート・花</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"人物の周囲にSNS映えする立体アイコン、通知、光る記号を配置する。\" /><span>SNSアイコン</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"衣装は前衛的で可愛く、ファンタジーとハイファッションを融合させる。\" /><span>前衛ファッション</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"背景は白を基調にして、人物と色彩が映える清潔な空間にする。\" /><span>白背景</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"背景は暗めにして、発光や反射の美しさを際立たせる。\" /><span>暗め背景</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"雑誌表紙らしい余白、見出し、洗練されたレイアウト感を入れる。ただし文字は崩れやすいので、必要な場合のみ明確な短い文字にする。\" /><span>表紙レイアウト</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"巨大ビジョンやビルボードの光が街に反射し、人物が大きく映し出されているような迫力を出す。\" /><span>巨大広告感</span></label>\n              <label class=\"chip\"><input type=\"checkbox\" name=\"details\" value=\"カメラを少し低めにして、巨大な画面を見上げるような迫力ある構図にする。\" /><span>見上げ構図</span></label>\n            </div>\n          </div>\n\n          <div class=\"section full\">\n            <label class=\"section-label\" for=\"customNote\">自由入力：追加したい指定</label>\n            <textarea id=\"customNote\" placeholder=\"例：表情は可愛い笑顔。髪型は参照画像に忠実。胸から上の構図。背景は淡いピンクと紫。\"></textarea>\n            <p class=\"note\">入力した内容は完成プロンプトの最後に追加されます。</p>\n          </div>\n        </div>\n      </section>\n\n      <section class=\"panel\">\n        <div class=\"panel-title\">\n          <span>完成プロンプト</span>\n          <span>Copy & Use</span>\n        </div>\n        <textarea id=\"output\" class=\"prompt-output\" readonly></textarea>\n        <div class=\"actions\">\n          <button id=\"copyBtn\">プロンプトをコピー</button>\n          <button id=\"resetBtn\" class=\"secondary\">初期状態に戻す</button>\n        </div>\n      </section>\n    </main>\n  </div>\n\n  <div id=\"modal-overlay\" class=\"modal-overlay\"></div>\n  \n  <div id=\"modal-aspectRatio\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>アスペクト比</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"aspectRatio\" value=\"3:4\" checked><span>3:4｜縦長・人物向け</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"aspectRatio\" value=\"9:16\"><span>9:16｜スマホ壁紙・SNS縦動画向け</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"aspectRatio\" value=\"4:5\"><span>4:5｜Instagram投稿向け</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"aspectRatio\" value=\"1:1\"><span>1:1｜正方形・アイコン向け</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"aspectRatio\" value=\"16:9\"><span>16:9｜映画ポスター・横長背景向け</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"aspectRatio\" value=\"2:3\"><span>2:3｜ポスター向け</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-framing\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>構図</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"framing\" value=\"胸から上の上半身構図。顔と表情を大きく見せる。\" checked><span>胸から上・上半身</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"framing\" value=\"腰から上の半身構図。衣装と世界観も見せる。\"><span>腰から上・半身</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"framing\" value=\"全身が見える構図。足先まで入れ、ポーズと衣装全体を見せる。\"><span>全身</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"framing\" value=\"顔を主役にしたクローズアップ構図。瞳、前髪、表情を強調する。\"><span>顔アップ</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"framing\" value=\"やや上から見下ろす可愛いハイアングル構図。\"><span>ハイアングル</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"framing\" value=\"映画ポスターのような奥行きのあるドラマチック構図。\"><span>映画ポスター風</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-dimension\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>2D / 3D</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"dimension\" value=\"3D\" checked><span>3D</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"dimension\" value=\"2D\"><span>2D</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"dimension\" value=\"2.5D\"><span>2.5D</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"dimension\" value=\"MIX\"><span>2Dと3Dを融合</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-personStyle\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>人物スタイル</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"real\"><span>リアル寄り</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"semiReal\"><span>セミリアル</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"anime\"><span>アニメ調</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"chibi\"><span>チビキャラ / SD</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"doll\"><span>3Dファッションドール</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"fluffyDoll\" checked><span>3Dふわふわファッションドール</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"cartoon\"><span>完全カートゥーン調</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"personStyle\" value=\"lineArt\"><span>ネオン線画</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-mediaEffect\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>媒体演出</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"none\" checked><span>なし</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"magazineCover\"><span>雑誌の表紙</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"fashionMagazine\"><span>高級ファッション誌の表紙</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"artBookCover\"><span>アートブック表紙</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"giantVision\"><span>街中の巨大ビジョン</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"buildingBillboard\"><span>ビル一面の巨大広告</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"shibuyaScreen\"><span>渋谷・繁華街の大型スクリーン</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"digitalSignage\"><span>未来的なデジタルサイネージ</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mediaEffect\" value=\"campaignPoster\"><span>ブランドキャンペーンポスター</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-mood\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>雰囲気</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mood\" value=\"可愛く、明るく、夢のようで、見た瞬間にときめく雰囲気。\" checked><span>可愛い・明るい</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mood\" value=\"神秘的で美しく、静かな物語性を感じる雰囲気。\"><span>神秘的・美しい</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mood\" value=\"高級ブランド広告のように洗練され、上品で存在感のある雰囲気。\"><span>高級感・広告風</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mood\" value=\"映画ポスターのようにドラマチックで、感情の奥行きがある雰囲気。\"><span>映画的・ドラマチック</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mood\" value=\"ポップでカラフル、少し奇抜でSNS映えする雰囲気。\"><span>ポップ・奇抜</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"mood\" value=\"透明感があり、清らかで幻想的な雰囲気。\"><span>透明感・清楚</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-lighting\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>光・質感</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"lighting\" value=\"柔らかなシネマティックライティング、細かな光の粒子、きらめき、浅い被写界深度。\" checked><span>シネマティック光</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"lighting\" value=\"虹色の発光、パステルネオン、透明感のある反射、華やかなグロー。\"><span>虹色ネオン</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"lighting\" value=\"白、ピンク、淡い紫、ゴールドの光を使い、可愛い夢色に仕上げる。\"><span>夢色パステル</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"lighting\" value=\"青、紫、シルバー、白の光で、神秘的で冷たく美しい空気感を作る。\"><span>青紫ミスティック</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"lighting\" value=\"黒背景に強い発光ライン、反射、ブルームを効かせる。\"><span>黒背景ネオン</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"lighting\" value=\"ハイエンドな3Dレンダリング、滑らかな表面、上質なトイ感、柔らかい陰影。\"><span>高級3Dレンダー</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-fantasy\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>✨ 幻想・ファンタジー</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"dreamSparkle\" checked><span>神秘的でキラキラ光る夢の世界</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"magicInk\"><span>虹色の魔法インクで世界を描く可愛いアーティスト</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"musicBox\"><span>美しいオルゴールの上で踊る幻想的な人形</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"jewel\"><span>巨大な宝石の中に閉じ込められた幻想的な存在</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-reshape\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>🌀 変化・再構築</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"buildingPerson\"><span>デジタルデータから人物が構築されている途中</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"petalsPerson\"><span>花びらが集まって人物になりつつある途中</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"waterPerson\"><span>透明な水が人物に変わっている途中</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"mirrorPerson\"><span>割れた鏡の破片が人物を再構築している途中</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"constellationPerson\"><span>星座と光の線から人物が現れている途中</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"modal-future\" class=\"modal-box\">\n    <div class=\"modal-header\">\n      <h3>🔮 未来・概念・不思議</h3>\n      <button type=\"button\" class=\"modal-close-btn\">&times;</button>\n    </div>\n    <div class=\"modal-body-content\">\n      <div class=\"radio-grid\">\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"emotionUI\"><span>感情を可視化する未来のインターフェース衣装</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"perfume\"><span>感情を香水として調合する幻想的な調香師</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"memoryMuseum\"><span>自分の記憶を展示する不思議な博物館</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"weatherFashion\"><span>天気そのものを衣装として着替えるモデル</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"shadowMascot\"><span>自分の影が可愛いマスコットになって動き出す世界</span></label>\n        <label class=\"radio-card\"><input type=\"radio\" name=\"theme\" value=\"brandAd\"><span>存在そのものがブランドになる未来広告ビジュアル</span></label>\n      </div>\n    </div>\n  </div>\n\n  <div id=\"toast\" class=\"toast\">コピーしました</div>\n\n  <script>\n    const $ = (id) => document.getElementById(id);\n\n    const styleMap = {\n      real: \"人物はリアル寄りの美しいデジタルアートとして描く。ただし参照画像の人物らしさを保ち、過度に別人化しない。\",\n      semiReal: \"人物はセミリアルな高精細デジタルアートとして描く。リアルさと可愛いスタイル化のバランスを取る。\",\n      anime: \"人物はアニメ調の美しいキャラクターとして描く。大きすぎない自然な瞳、可愛い表情、繊細な髪のシルエットを意識する。\",\n      chibi: \"人物はチビキャラ / SDとして描く。大きな頭、小さな体、短い手足、丸い頬、可愛いシルエットにする。\",\n      doll: \"人物はプレミアムな3Dファッションドールとして描く。コレクタブルフィギュアのような上質な質感、滑らかな肌、艶のあるドールヘアにする。\",\n      fluffyDoll: \"人物はプレミアムなスタイル化された3Dふわふわファッションドールとして描く。強い似せ方を保ちながら、完全にカートゥーン調のふわふわキャラクター世界にする。\",\n      cartoon: \"人物は完全なカートゥーン調キャラクターとして描く。リアルな人間感を抑え、柔らかく丸い形、親しみやすい可愛さを重視する。\",\n      lineArt: \"人物は発光するネオン線画アートとして描く。黒背景にカラフルな光のラインで輪郭、髪、瞳、衣装を表現する。\"\n    };\n\n    const dimensionMap = {\n      \"3D\": \"表現方式は3D。立体感、滑らかなマテリアル、柔らかい陰影、トイ感のある高品質レンダリングを重視する。\",\n      \"2D\": \"表現方式は2D。イラストとしての線、色面、構図、キャラクター性を重視する。\",\n      \"2.5D\": \"表現方式は2.5D。2Dイラストの魅力と3D的な奥行き、光、質感を融合する。\",\n      \"MIX\": \"表現方式は2Dと3Dの融合。人物は立体的に、背景やエフェクトはイラスト的に見せ、独自のビジュアルにする。\"\n    };\n\n    const themeMap = {\n      dreamSparkle: \"テーマは、神秘的でキラキラ光り輝く夢の可愛いデジタルアート。背景には柔らかな光、星屑、パステルカラーの霧、浮遊するきらめきを配置する。\",\n      magicInk: \"テーマは、虹色の魔法インクで世界を描く可愛いアーティスト。人物は大きな筆や羽ペンを持ち、空中に虹色の線、花、鳥、星、ハート、リボン、光の軌跡を描いている。\",\n      buildingPerson: \"テーマは、デジタルデータからその人物がまだ完全ではない状態で構築されている途中。顔の一部だけ完成し、髪、肩、衣装、体の輪郭はワイヤーフレーム、発光ポリゴン、ピクセル、ホログラム層として形成途中にする。\",\n      petalsPerson: \"テーマは、無数の花びらが集まり、その人物になりつつある途中。片目、鼻先、唇、頬の中心だけ人物として完成し、髪や衣装の一部は花びらの群れとして残す。\",\n      waterPerson: \"テーマは、透明な水が集まってその人物に変わっている途中。顔は完成に近く、髪、肩、衣装、腕の端は水や透明な液体として残し、雫、波紋、反射を美しく入れる。\",\n      mirrorPerson: \"テーマは、割れた鏡の破片が集まり、その人物を再構築している途中。鏡の破片には目、髪、表情、光が断片的に映り込み、空中で本人の形へ戻っていく。\",\n      constellationPerson: \"テーマは、星座と光の線からその人物が現れている途中。星と星を結ぶ光が輪郭を作り、顔や胸元は完成、髪の後ろや肩はまだ星座の線と発光点で形成途中にする。\",\n      emotionUI: \"テーマは、感情を可視化するインターフェースを衣装としてまとう未来の主人公。半透明UI、感情グラフ、浮遊アイコン、発光波形、ハートビートラインを衣装として構成する。\",\n      perfume: \"テーマは、人の感情を香水として調合する幻想的な調香師。透明な香水瓶の中に喜び、切なさ、恋、夢、記憶が色の違う光や煙として閉じ込められている。\",\n      memoryMuseum: \"テーマは、自分の記憶を展示する不思議な博物館。展示ケースには小さな街、星空、花、手紙、写真、時計、ハートの結晶など、思い出のミニチュアが光っている。\",\n      weatherFashion: \"テーマは、天気そのものを衣装として着替える可愛いファッションモデル。晴れ、雨、雷、虹、雪、夕焼け雲が衣装や背景として混ざり合う。\",\n      shadowMascot: \"テーマは、自分の影が可愛いマスコットになって動き出した不思議な世界。足元の影は丸く小さな本人風の黒いマスコットになり、本人のポーズを真似している。\",\n      brandAd: \"テーマは、存在そのものがブランドとして成立している未来の広告ビジュアル。特定の商品は置かず、人物のオーラ、姿勢、衣装、抽象ロゴ、立体タイポグラフィでブランド性を表現する。\",\n      musicBox: \"テーマは、美しいオルゴールの上で踊る幻想的な人形。精巧なアンティーク調の台座、金色の歯車、リボン、星、ガラス細工に囲まれている。\",\n      jewel: \"テーマは、巨大な宝石の中に閉じ込められた幻想的な存在。クリスタル内部の屈折、虹色の輝き、反射、浮遊する結晶を美しく描く。\"\n    };\n\n    const mediaMap = {\n      none: \"\",\n      magazineCover: \"【媒体演出】雑誌の表紙として成立するビジュアルにする。人物を主役にし、余白、表紙らしい構図、洗練された見出し配置、ファッション誌のような完成度を意識する。文字を入れる場合は短く読みやすくし、不要な文字化けは避ける。\",\n      fashionMagazine: \"【媒体演出】高級ファッション誌の表紙のように描く。人物の顔、衣装、ポーズを強く見せ、余白、誌面デザイン、上品なタイポグラフィ風レイアウト、ラグジュアリーな光で仕上げる。\",\n      artBookCover: \"【媒体演出】アートブックの表紙のように描く。余白を美しく使い、人物と世界観が一枚の作品として成立するように、静かな高級感と幻想的な構成にする。\",\n      giantVision: \"【媒体演出】街中の巨大ビジョンに人物ビジュアルが大きく映し出されている演出にする。巨大LEDスクリーン、街の光、反射、通行人のシルエット、スケール感を入れる。\",\n      buildingBillboard: \"【媒体演出】ビル一面を使った巨大広告ビジュアルにする。建物の外壁全体に人物が大きく表示され、夜の街や都会の光に反射して圧倒的な存在感を出す。\",\n      shibuyaScreen: \"【媒体演出】渋谷や繁華街の大型スクリーンに表示されたような演出にする。複数のビジョン、ネオン、交差点、街の反射、群衆のシルエットでSNS映えする迫力を出す。\",\n      digitalSignage: \"【媒体演出】未来的なデジタルサイネージ広告として描く。透明ディスプレイ、立体UI、発光パネル、ホログラム広告、都会的な近未来空間を組み合わせる。\",\n      campaignPoster: \"【媒体演出】ブランドキャンペーンポスターのように描く。人物の存在感を中心に、抽象的なロゴ風モチーフ、洗練された構成、広告写真のような完成度にする。\"\n    };\n\n    function checkedValues(name) {\n      return [...document.querySelectorAll(`input[name=\"${name}\"]:checked`)].map(input => input.value);\n    }\n\n    function getRadioValue(name) {\n      const el = document.querySelector(`input[name=\"${name}\"]:checked`);\n      return el ? el.value : \"\";\n    }\n\n    function generatePrompt() {\n      const aspectRatio = getRadioValue(\"aspectRatio\") || \"3:4\";\n      const framing = getRadioValue(\"framing\") || \"胸から上の上半身構図。顔と表情を大きく見せる。\";\n      const dimension = getRadioValue(\"dimension\") || \"3D\";\n      const personStyle = getRadioValue(\"personStyle\") || \"fluffyDoll\";\n      const theme = getRadioValue(\"theme\") || \"dreamSparkle\"; \n      const mediaEffect = getRadioValue(\"mediaEffect\") || \"none\";\n      const mood = getRadioValue(\"mood\") || \"可愛く、明るく、夢のようで、見た瞬間にときめく雰囲気。\";\n      const lighting = getRadioValue(\"lighting\") || \"柔らかなシネマティックライティング、細かな光の粒子、きらめき、浅い被写界深度。\";\n      \n      const customNote = $(\"customNote\").value.trim();\n      const fluffy = checkedValues(\"fluffy\");\n      const details = checkedValues(\"details\");\n\n      const promptParts = [\n        `ASPECT_RATIO: ${aspectRatio}`,\n        \"\",\n        \"アップロードした人物画像をアイデンティティ参照として使用してください。\",\n        \"構図やポーズをそのままコピーするのではなく、人物の顔立ち、髪型、髪色、前髪、目元、眉、鼻、口元、肌の印象、年齢感、全体の雰囲気を保ちながら、このプロンプトの世界観に合わせて自然に再構築してください。\",\n        \"参照画像と最終構図の角度が一致しない場合でも、同一人物だと分かるように顔を自然に補完してください。別人化しないようにしてください。\",\n        \"\",\n        `【構図】${framing}`,\n        `【表現方式】${dimensionMap[dimension]}`,\n        `【人物スタイル】${styleMap[personStyle]}`,\n        fluffy.length ? `【ふわふわドール指定】\\n${fluffy.map(v => \"・\" + v).join(\"\\n\")}` : \"\",\n        `【世界観】${themeMap[theme]}`,\n        mediaMap[mediaEffect],\n        `【雰囲気】${mood}`,\n        `【光・質感】${lighting}`,\n        details.length ? `【追加ディテール】\\n${details.map(v => \"・\" + v).join(\"\\n\")}` : \"\",\n        \"\",\n        \"【品質】高精細、華やか、可愛い、完成度の高いデジタルアート。人物の魅力が最優先で伝わるようにする。\",\n        \"【避けること】別人化、不自然な顔、リアルすぎる人間CG、怖い表情、崩れた手、過剰なノイズ、文字化け、不要なロゴ、低品質な質感は避ける。\",\n        customNote ? `\\n【自由指定】${customNote}` : \"\"\n      ];\n\n      $(\"output\").value = promptParts.filter(Boolean).join(\"\\n\");\n    }\n\n    function showToast(message) {\n      const toast = $(\"toast\");\n      toast.textContent = message;\n      toast.classList.add(\"show\");\n      setTimeout(() => toast.classList.remove(\"show\"), 1600);\n    }\n\n    // === モーダル開閉とトップ画面ボタンのテキスト連動 ===\n    const overlay = $(\"modal-overlay\");\n\n    function updateAllTriggers() {\n      // 1. 世界観テーマ(3分割トリガー)の処理\n      document.querySelectorAll(\".category-trigger.theme-mode\").forEach((btn) => {\n        btn.classList.remove(\"active\");\n        btn.querySelector(\".category-trigger-desc\").textContent = \"未選択\";\n      });\n      const checkedTheme = document.querySelector('input[name=\"theme\"]:checked');\n      if (checkedTheme) {\n        const modal = checkedTheme.closest(\".modal-box\");\n        if (modal) {\n          const trigger = document.querySelector(`.category-trigger[data-target=\"${modal.id}\"]`);\n          if (trigger) {\n            trigger.classList.add(\"active\");\n            trigger.querySelector(\".category-trigger-desc\").textContent = checkedTheme.closest(\".radio-card\").querySelector(\"span\").textContent;\n          }\n        }\n      }\n\n      // 2. その他の単一トリガーの処理\n      const simpleItems = [\"aspectRatio\", \"framing\", \"dimension\", \"personStyle\", \"mediaEffect\", \"mood\", \"lighting\"];\n      simpleItems.forEach(name => {\n        const checked = document.querySelector(`input[name=\"${name}\"]:checked`);\n        if (checked) {\n          const label = checked.closest(\".radio-card\").querySelector(\"span\").textContent;\n          const trigger = document.querySelector(`.category-trigger[data-target=\"modal-${name}\"]`);\n          if (trigger) {\n            trigger.querySelector(\".category-trigger-desc\").textContent = label;\n          }\n        }\n      });\n    }\n\n    // トリガーカードをクリックでモーダルを表示\n    document.querySelectorAll(\".category-trigger\").forEach((btn) => {\n      btn.addEventListener(\"click\", () => {\n        const targetId = btn.getAttribute(\"data-target\");\n        const targetModal = $(targetId);\n        if (targetModal) {\n          overlay.style.display = \"block\";\n          targetModal.style.display = \"block\";\n          setTimeout(() => {\n            overlay.classList.add(\"show\");\n            targetModal.classList.add(\"show\");\n          }, 10);\n        }\n      });\n    });\n\n    // モーダルを閉じる処理\n    function closeModal() {\n      const activeModal = document.querySelector(\".modal-box.show\");\n      if (activeModal) {\n        activeModal.classList.remove(\"show\");\n        overlay.classList.remove(\"show\");\n        setTimeout(() => {\n          activeModal.style.display = \"none\";\n          overlay.style.display = \"none\";\n        }, 250);\n      }\n    }\n\n    document.querySelectorAll(\".modal-close-btn\").forEach((closeBtn) => {\n      closeBtn.addEventListener(\"click\", (e) => {\n        e.stopPropagation();\n        closeModal();\n      });\n    });\n    overlay.addEventListener(\"click\", closeModal);\n\n    // 全てのラジオボタン変更時に画面更新＆モーダルを閉じる\n    document.querySelectorAll('input[type=\"radio\"]').forEach((radio) => {\n      radio.addEventListener(\"change\", () => {\n        updateAllTriggers();\n        generatePrompt();\n        setTimeout(closeModal, 250);\n      });\n    });\n\n    // チェックボックス・テキストエリアの変更でプロンプト更新\n    document.querySelectorAll(\"textarea, input[type='checkbox']\").forEach((el) => {\n      el.addEventListener(\"input\", generatePrompt);\n      el.addEventListener(\"change\", generatePrompt);\n    });\n\n    $(\"copyBtn\").addEventListener(\"click\", async () => {\n      const text = $(\"output\").value;\n      try {\n        await navigator.clipboard.writeText(text);\n        showToast(\"コピーしました\");\n      } catch (error) {\n        $(\"output\").select();\n        document.execCommand(\"copy\");\n        showToast(\"コピーしました\");\n      }\n    });\n\n    $(\"resetBtn\").addEventListener(\"click\", () => {\n      const defaults = {\n        aspectRatio: \"3:4\",\n        framing: \"胸から上の上半身構図。顔と表情を大きく見せる。\",\n        dimension: \"3D\",\n        personStyle: \"fluffyDoll\",\n        theme: \"dreamSparkle\",\n        mediaEffect: \"none\",\n        mood: \"可愛く、明るく、夢のようで、見た瞬間にときめく雰囲気。\",\n        lighting: \"柔らかなシネマティックライティング、細かな光の粒子、きらめき、浅い被写界深度。\"\n      };\n      \n      for (const [name, val] of Object.entries(defaults)) {\n        const radio = document.querySelector(`input[name=\"${name}\"][value=\"${val}\"]`);\n        if (radio) radio.checked = true;\n      }\n\n      $(\"customNote\").value = \"\";\n      document.querySelectorAll(\"input[name='fluffy']\").forEach((input, index) => {\n        input.checked = index < 4;\n      });\n      document.querySelectorAll(\"input[name='details']\").forEach((input) => {\n        input.checked = false;\n      });\n      \n      updateAllTriggers();\n      generatePrompt();\n      showToast(\"初期状態に戻しました\");\n    });\n\n    // 初回実行\n    updateAllTriggers();\n    generatePrompt();\n  <\/script>\n</body>\n</html>"
    },

      "title": "コスプレ生成",
      "htmlContent": "<!DOCTYPE html><html lang=\"ja\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n  <title>コスプレイベント囲み撮影プロンプト生成ツール</title>\n  <style>\n    :root {\n      --bg: #0f1117;\n      --panel: #171a23;\n      --panel-2: #202433;\n      --text: #f5f6fb;\n      --muted: #aab0c4;\n      --line: #30364a;\n      --accent: #ff6fae;\n      --accent-2: #7ad7ff;\n      --good: #8ef0b0;\n      --danger: #ff8f8f;\n      --radius: 18px;\n      --shadow: 0 18px 50px rgba(0,0,0,.35);\n    }* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", sans-serif;\n  background:\n    radial-gradient(circle at 10% 10%, rgba(255,111,174,.22), transparent 28%),\n    radial-gradient(circle at 90% 0%, rgba(122,215,255,.18), transparent 32%),\n    linear-gradient(135deg, #0f1117, #111421 48%, #0d0f15);\n  color: var(--text);\n  min-height: 100vh;\n  padding: 20px;\n}\n\n.app {\n  width: min(1380px, 100%);\n  margin: 0 auto;\n  display: grid;\n  grid-template-columns: 430px 1fr;\n  gap: 18px;\n  align-items: start;\n}\n\nheader {\n  grid-column: 1 / -1;\n  background: rgba(23,26,35,.78);\n  backdrop-filter: blur(12px);\n  border: 1px solid rgba(255,255,255,.08);\n  border-radius: var(--radius);\n  padding: 18px 20px;\n  box-shadow: var(--shadow);\n  display: flex;\n  gap: 16px;\n  align-items: center;\n  justify-content: space-between;\n  flex-wrap: wrap;\n}\n\nh1 {\n  font-size: clamp(22px, 3vw, 34px);\n  margin: 0 0 6px;\n  letter-spacing: .02em;\n}\n\n.subtitle {\n  margin: 0;\n  color: var(--muted);\n  line-height: 1.55;\n  font-size: 14px;\n}\n\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 14px;\n  border-radius: 999px;\n  background: linear-gradient(135deg, rgba(255,111,174,.18), rgba(122,215,255,.14));\n  border: 1px solid rgba(255,255,255,.1);\n  color: #fff;\n  font-weight: 700;\n  white-space: nowrap;\n}\n\n.panel {\n  background: rgba(23,26,35,.88);\n  border: 1px solid rgba(255,255,255,.08);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  overflow: hidden;\n}\n\n.panel-title {\n  padding: 14px 16px;\n  background: rgba(255,255,255,.04);\n  border-bottom: 1px solid rgba(255,255,255,.08);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 10px;\n}\n\n.panel-title h2 {\n  margin: 0;\n  font-size: 16px;\n  letter-spacing: .03em;\n}\n\n.panel-body {\n  padding: 16px;\n}\n\n.controls {\n  display: grid;\n  gap: 14px;\n}\n\n.group {\n  background: rgba(255,255,255,.035);\n  border: 1px solid rgba(255,255,255,.075);\n  border-radius: 14px;\n  padding: 12px;\n}\n\n.group h3 {\n  margin: 0 0 10px;\n  font-size: 13px;\n  color: #fff;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n\n.dot {\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background: linear-gradient(135deg, var(--accent), var(--accent-2));\n  flex: 0 0 auto;\n}\n\nlabel {\n  display: block;\n  font-size: 12px;\n  color: var(--muted);\n  margin-bottom: 6px;\n}\n\nselect,\ninput,\ntextarea {\n  width: 100%;\n  border: 1px solid var(--line);\n  background: #111421;\n  color: var(--text);\n  border-radius: 12px;\n  padding: 10px 11px;\n  font-size: 14px;\n  outline: none;\n}\n\nselect:focus,\ninput:focus,\ntextarea:focus {\n  border-color: rgba(122,215,255,.8);\n  box-shadow: 0 0 0 3px rgba(122,215,255,.14);\n}\n\ntextarea {\n  resize: vertical;\n  min-height: 78px;\n  line-height: 1.55;\n}\n\n.row {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n\n.chips {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 8px;\n}\n\n.chip {\n  position: relative;\n}\n\n.chip input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n\n.chip span {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 38px;\n  text-align: center;\n  padding: 8px 9px;\n  border-radius: 12px;\n  border: 1px solid var(--line);\n  background: rgba(17,20,33,.92);\n  color: var(--muted);\n  font-size: 12px;\n  line-height: 1.3;\n  cursor: pointer;\n  transition: .18s ease;\n  user-select: none;\n}\n\n.chip input:checked + span {\n  color: #fff;\n  border-color: rgba(255,111,174,.85);\n  background: linear-gradient(135deg, rgba(255,111,174,.24), rgba(122,215,255,.14));\n  box-shadow: 0 0 0 3px rgba(255,111,174,.08);\n}\n\n.output-wrap {\n  display: grid;\n  grid-template-rows: auto 1fr;\n  gap: 18px;\n}\n\n.toolbar {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  align-items: center;\n  justify-content: space-between;\n  margin-bottom: 12px;\n}\n\n.btns {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n}\n\nbutton {\n  border: 0;\n  border-radius: 12px;\n  padding: 10px 14px;\n  font-weight: 800;\n  color: #fff;\n  background: var(--panel-2);\n  cursor: pointer;\n  transition: transform .12s ease, filter .12s ease, background .12s ease;\n}\n\nbutton:hover {\n  transform: translateY(-1px);\n  filter: brightness(1.08);\n}\n\n.primary {\n  background: linear-gradient(135deg, var(--accent), #a66bff 52%, var(--accent-2));\n}\n\n.ghost {\n  background: rgba(255,255,255,.08);\n  border: 1px solid rgba(255,255,255,.1);\n}\n\n.danger {\n  background: rgba(255,143,143,.16);\n  border: 1px solid rgba(255,143,143,.32);\n  color: #ffd2d2;\n}\n\n.output {\n  min-height: 530px;\n  font-size: 14px;\n  line-height: 1.65;\n  white-space: pre-wrap;\n  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, \"Liberation Mono\", monospace;\n  background: #0c0f18;\n  border-color: rgba(122,215,255,.18);\n}\n\n.mini {\n  color: var(--muted);\n  font-size: 12px;\n  line-height: 1.55;\n  margin: 8px 0 0;\n}\n\n.status {\n  font-size: 12px;\n  color: var(--good);\n  min-height: 18px;\n}\n\n.preset-grid {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 10px;\n}\n\n.preset-card {\n  padding: 12px;\n  min-height: 92px;\n  background: rgba(255,255,255,.04);\n  border: 1px solid rgba(255,255,255,.08);\n  border-radius: 14px;\n  cursor: pointer;\n  transition: .16s ease;\n}\n\n.preset-card:hover {\n  border-color: rgba(255,111,174,.55);\n  transform: translateY(-1px);\n  background: rgba(255,255,255,.065);\n}\n\n.preset-card strong {\n  display: block;\n  font-size: 13px;\n  margin-bottom: 6px;\n}\n\n.preset-card span {\n  display: block;\n  font-size: 11px;\n  color: var(--muted);\n  line-height: 1.45;\n}\n\n.tabbar {\n  display: flex;\n  gap: 8px;\n  flex-wrap: wrap;\n  margin-bottom: 12px;\n}\n\n.tabbar button {\n  padding: 8px 11px;\n  font-size: 12px;\n  background: rgba(255,255,255,.07);\n  border: 1px solid rgba(255,255,255,.08);\n}\n\n.tabbar button.active {\n  background: linear-gradient(135deg, rgba(255,111,174,.32), rgba(122,215,255,.18));\n  border-color: rgba(255,111,174,.55);\n}\n\n.hidden { display: none; }\n\n@media (max-width: 980px) {\n  body { padding: 12px; }\n  .app { grid-template-columns: 1fr; }\n  .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .output { min-height: 420px; }\n}\n\n@media (max-width: 560px) {\n  .row { grid-template-columns: 1fr; }\n  .chips { grid-template-columns: 1fr; }\n  .preset-grid { grid-template-columns: 1fr; }\n  header { padding: 15px; }\n}\n\n  </style>\n</head>\n<body>\n  <main class=\"app\">\n    <header>\n      <div>\n        <h1>コスプレイベント囲み撮影プロンプト生成ツール</h1>\n        <p class=\"subtitle\">画像参照の人物を、リアルフォトのコスプレイベントで囲み撮影されているシーンに変換するための補助HTMLです。主役は鮮明、撮影者・観客・カメラ機材は被写界深度でボカす前提で生成します。</p>\n      </div>\n      <div class=\"badge\">REAL PHOTO / COSPLAY EVENT</div>\n    </header><section class=\"panel\">\n  <div class=\"panel-title\">\n    <h2>設定パネル</h2>\n    <span class=\"status\" id=\"status\"></span>\n  </div>\n  <div class=\"panel-body controls\">\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>基本設定</h3>\n      <div class=\"row\">\n        <div>\n          <label for=\"aspect\">アスペクト比</label>\n          <select id=\"aspect\">\n            <option value=\"9:16 vertical smartphone composition\">9:16 縦長</option>\n            <option value=\"4:5 vertical social media portrait\">4:5 縦投稿</option>\n            <option value=\"3:4 vertical portrait\">3:4 ポートレート</option>\n            <option value=\"1:1 square composition\">1:1 正方形</option>\n            <option value=\"16:9 horizontal cinematic composition\">16:9 横長</option>\n          </select>\n        </div>\n        <div>\n          <label for=\"identity\">似せ方</label>\n          <select id=\"identity\">\n            <option value=\"very strong identity preservation, keep the same face, hairstyle, hair color, bangs, eyes, eyebrows, nose, lips, skin impression, age impression and overall aura from the reference image\">強く似せる</option>\n            <option value=\"strong identity preservation while allowing natural cosplay styling\">自然に似せる</option>\n            <option value=\"soft identity preservation, keep the mood and main facial features but allow more costume adaptation\">雰囲気寄せ</option>\n          </select>\n        </div>\n      </div>\n      <label for=\"mainSubject\" style=\"margin-top:10px;\">主役の指定</label>\n      <input id=\"mainSubject\" value=\"アップロードした参照画像の人物を主役のコスプレイヤーとして使用\" />\n      <p class=\"mini\">画像生成時は、参照画像を添付したうえで、このツールの完成プロンプトを貼り付けてください。</p>\n    </div>\n\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>コスプレパターン</h3>\n      <select id=\"cosplay\">\n        <option value=\"a glamorous fantasy princess cosplay with ornate fabric, jewels, ribbons, lace, elegant armor-like details and a premium handmade costume look\">幻想プリンセス</option>\n        <option value=\"a cool cyber idol cosplay with translucent panels, LED-like accents, futuristic accessories, glossy synthetic fabric and stage-ready styling\">サイバーアイドル</option>\n        <option value=\"a magical girl cosplay with layered frills, bows, star motifs, wand-inspired accessories and a cute heroic silhouette\">魔法少女</option>\n        <option value=\"a dark gothic lolita cosplay with black lace, corset details, roses, velvet texture and dramatic elegance\">ゴシックロリータ</option>\n        <option value=\"a high-end maid cosplay with refined apron details, lace cuffs, ribbon accents and elegant black-and-white styling\">高級メイド</option>\n        <option value=\"a shrine maiden fantasy cosplay with modern kimono styling, flowing sleeves, sacred red-and-white details and subtle gold ornaments\">和風巫女ファンタジー</option>\n        <option value=\"a battle game heroine cosplay with stylish armor pieces, leather belts, gloves, boots and a strong character silhouette\">ゲーム戦闘ヒロイン</option>\n        <option value=\"a vampire queen cosplay with luxurious cape, dark red jewels, lace, black satin and mysterious aristocratic styling\">ヴァンパイアクイーン</option>\n        <option value=\"a school idol cosplay with coordinated jacket, pleated skirt, ribbons, sparkling accessories and cheerful performance styling\">学園アイドル</option>\n        <option value=\"a futuristic nurse cosplay with glossy white fabric, pastel medical motifs, cute sci-fi accessories and clean high-fashion styling\">近未来ナース</option>\n        <option value=\"a steampunk adventurer cosplay with brass goggles, corset, leather belts, layered skirt, gears and antique fantasy details\">スチームパンク冒険者</option>\n        <option value=\"a Chinese fantasy dress cosplay with elegant qipao-inspired silhouette, embroidery, hair ornaments and flowing sleeves\">中華ファンタジードレス</option>\n        <option value=\"a ninja idol cosplay mixing black tactical fabric, cute ribbons, short cape, thigh-high boots and modern stage costume elements\">忍者アイドル</option>\n        <option value=\"a royal knight cosplay with polished armor accents, cape, ornate boots, gemstone details and elegant heroic styling\">ロイヤルナイト</option>\n        <option value=\"custom\">自由入力</option>\n      </select>\n      <textarea id=\"customCosplay\" class=\"hidden\" placeholder=\"自由入力：例）白い羽根と透明なドレスの天使系コスプレ、近未来の戦う歌姫風など\"></textarea>\n    </div>\n\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>会場・シチュエーション</h3>\n      <div class=\"row\">\n        <div>\n          <label for=\"venue\">会場内 / 外</label>\n          <select id=\"venue\">\n            <option value=\"inside a crowded indoor cosplay convention hall with booths, banners, ceiling lights, event partitions and many photographers around\">会場内・大型ホール</option>\n            <option value=\"inside an official cosplay photo area with simple backdrop panels, queue lines, staff signs and many photographers kneeling or standing around\">会場内・撮影エリア</option>\n            <option value=\"outside the convention venue in an urban plaza with sunlight, glass buildings, banners, crowd flow and photographers forming a semicircle\">会場外・都市型広場</option>\n            <option value=\"outside near a convention center entrance with event posters, queue fences, bright daylight and photographers surrounding the cosplayer\">会場外・入口付近</option>\n            <option value=\"at a night cosplay event area with warm street lights, glowing signage, bokeh city lights and photographers using camera flashes\">夜イベント・屋外</option>\n            <option value=\"inside a premium exhibition booth with brand-like lighting, glossy floor, LED panels and camera flashes from the crowd\">企業ブース風</option>\n          </select>\n        </div>\n        <div>\n          <label for=\"crowdShape\">囲み撮影の形</label>\n          <select id=\"crowdShape\">\n            <option value=\"photographers forming a wide semicircle around the cosplayer, many cameras visible in the blurred foreground\">半円の囲み撮影</option>\n            <option value=\"photographers surrounding the cosplayer from both left and right sides, creating an intense press-photo atmosphere\">左右から囲まれる</option>\n            <option value=\"low-angle photographers kneeling in front and standing photographers behind them, all blurred by shallow depth of field\">前列しゃがみ・後列立ち</option>\n            <option value=\"a dense camera crowd with lenses, smartphones and flashes around the frame, but faces and bodies heavily blurred\">密集したカメラ群</option>\n            <option value=\"a clean professional photo-call scene with enough spacing, camera flashes, event staff in the distance and controlled crowd flow\">整理された公式撮影会</option>\n          </select>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>表情・ポーズ</h3>\n      <div class=\"row\">\n        <div>\n          <label for=\"expression\">表情パターン</label>\n          <select id=\"expression\">\n            <option value=\"a confident charming smile, looking like a professional cosplayer enjoying the attention\">自信のある笑顔</option>\n            <option value=\"a cute shy smile with slightly embarrassed but happy eyes\">照れ笑い</option>\n            <option value=\"a cool serious expression with sharp eyes and cinematic charisma\">クールで真剣</option>\n            <option value=\"a playful wink with a bright idol-like smile\">ウインク</option>\n            <option value=\"a mysterious gentle smile with calm eyes and elegant presence\">ミステリアスな微笑み</option>\n            <option value=\"an energetic cheerful smile, lively and event-friendly\">元気で明るい笑顔</option>\n            <option value=\"a dramatic heroic expression, as if posing as the main character of a game or anime\">主人公感のある表情</option>\n          </select>\n        </div>\n        <div>\n          <label for=\"pose\">ポーズ</label>\n          <select id=\"pose\">\n            <option value=\"standing in the center, slightly angled body, one hand near the costume detail, natural event-photo pose\">中央で自然な立ちポーズ</option>\n            <option value=\"posing with one hand on the waist and the other hand showing a character-like gesture\">片手腰＋キャラポーズ</option>\n            <option value=\"making a cute peace sign while facing the main camera, with camera flashes around\">ピースサイン</option>\n            <option value=\"holding a prop weapon or magical item, posing dramatically but safely for photographers\">小道具を持った決めポーズ</option>\n            <option value=\"slightly leaning forward toward the cameras, friendly and photogenic\">少し前傾でファンサ</option>\n            <option value=\"turning sideways with a profile-focused cosplay pose while looking toward the cameras\">横向き気味の決めポーズ</option>\n          </select>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>色の組み合わせ</h3>\n      <div class=\"chips\" id=\"colors\">\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"pink and white with pearl highlights, soft gold accents and a cute premium finish\" checked><span>ピンク×白×パール</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"black and crimson red with gold accents, dramatic and luxurious\"><span>黒×深紅×金</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"blue and silver with icy white highlights, cool and elegant\"><span>青×銀×白</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"purple and black with neon magenta accents, mysterious and stylish\"><span>紫×黒×ネオンピンク</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"emerald green and white with gold ornaments, magical and fresh\"><span>エメラルド×白×金</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"yellow and orange with warm gold highlights, bright and energetic\"><span>黄×オレンジ×金</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"monochrome black and white with silver shine, graphic and high-fashion\"><span>白黒×シルバー</span></label>\n        <label class=\"chip\"><input type=\"radio\" name=\"color\" value=\"pastel rainbow colors with translucent shiny fabric and dreamy highlights\"><span>パステル虹色</span></label>\n      </div>\n    </div>\n\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>写真表現・ボケ</h3>\n      <div class=\"row\">\n        <div>\n          <label for=\"lens\">レンズ感</label>\n          <select id=\"lens\">\n            <option value=\"realistic 85mm portrait lens, shallow depth of field, natural compression, professional event photography\">85mmポートレート</option>\n            <option value=\"realistic 50mm event portrait lens, natural perspective, shallow depth of field, documentary realism\">50mmイベント写真</option>\n            <option value=\"realistic 35mm wide event photo, dynamic crowd perspective, foreground cameras blurred\">35mm広め</option>\n            <option value=\"cinematic telephoto event photography, strong background compression and creamy bokeh\">望遠シネマ風</option>\n          </select>\n        </div>\n        <div>\n          <label for=\"blur\">撮影者のボケ具合</label>\n          <select id=\"blur\">\n            <option value=\"photographers, spectators, camera lenses and smartphones are heavily blurred with strong foreground and background bokeh; only the cosplayer is tack sharp\">強くボカす</option>\n            <option value=\"photographers and crowd are softly blurred by shallow depth of field while camera silhouettes remain recognizable\">自然にボカす</option>\n            <option value=\"foreground cameras are very blurred and large, background crowd is blurred, creating an immersive surrounded feeling\">前景カメラを大きくボカす</option>\n            <option value=\"camera flashes and crowd lights become beautiful bokeh circles around the sharp cosplayer\">光の玉ボケを強調</option>\n          </select>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"group\">\n      <h3><span class=\"dot\"></span>追加要素</h3>\n      <label for=\"extra\">任意の追加指定</label>\n      <textarea id=\"extra\" placeholder=\"例）衣装の露出は控えめ、イベント看板を背景に入れる、フラッシュの光を強める、縦長SNS用に余白を作る など\"></textarea>\n    </div>\n  </div>\n</section>\n\n<section class=\"output-wrap\">\n  <section class=\"panel\">\n    <div class=\"panel-title\">\n      <h2>プリセット</h2>\n      <span class=\"mini\">クリックで一括反映</span>\n    </div>\n    <div class=\"panel-body\">\n      <div class=\"preset-grid\">\n        <div class=\"preset-card\" data-preset=\"princess\">\n          <strong>王道キラキラ囲み</strong>\n          <span>幻想プリンセス / 会場内 / 半円囲み / ピンク白</span>\n        </div>\n        <div class=\"preset-card\" data-preset=\"cyber\">\n          <strong>近未来サイバー</strong>\n          <span>サイバーアイドル / 企業ブース / ネオン系 / 光ボケ強め</span>\n        </div>\n        <div class=\"preset-card\" data-preset=\"gothic\">\n          <strong>ダーク高級感</strong>\n          <span>ゴシックロリータ / 夜イベント / 黒赤金 / クール表情</span>\n        </div>\n        <div class=\"preset-card\" data-preset=\"outdoor\">\n          <strong>屋外イベント感</strong>\n          <span>会場外広場 / 35mm / 前景カメラボケ / 明るい笑顔</span>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"panel\">\n    <div class=\"panel-title\">\n      <h2>完成プロンプト</h2>\n      <div class=\"btns\">\n        <button class=\"primary\" id=\"generateBtn\">プロンプト生成</button>\n        <button class=\"ghost\" id=\"copyBtn\">コピー</button>\n        <button class=\"ghost\" id=\"copyNegativeBtn\">ネガティブだけコピー</button>\n        <button class=\"danger\" id=\"resetBtn\">初期化</button>\n      </div>\n    </div>\n    <div class=\"panel-body\">\n      <div class=\"tabbar\">\n        <button class=\"active\" data-tab=\"jp\">日本語プロンプト</button>\n        <button data-tab=\"en\">English Prompt</button>\n        <button data-tab=\"negative\">ネガティブ</button>\n      </div>\n      <textarea id=\"output\" class=\"output\" spellcheck=\"false\"></textarea>\n      <p class=\"mini\">ポイント：囲み撮影感を出すために「前景のカメラ」「周囲の撮影者」「フラッシュ」「浅い被写界深度」を入れ、人物以外はボカす指定を強めています。</p>\n    </div>\n  </section>\n</section>\n\n  </main>  <script>\n    const $ = (id) => document.getElementById(id);\n    const status = $('status');\n    let currentTab = 'jp';\n    let prompts = { jp: '', en: '', negative: '' };\n\n    const negativePrompt = `低品質, 低解像度, ぼやけた主役, 主役の顔が崩れる, 別人化, 顔が似ていない, 目の形が違う, 髪型が違う, 髪色が違う, 年齢感が変わる, 不自然な肌, 過度な美肌加工, AIっぽい顔, 不自然な手, 指の本数が多い, 指の欠損, 腕が多い, 足が多い, 体の歪み, 衣装の破綻, 露出過多, 下品な衣装, 実在ブランドロゴ, 読めない文字, 変な看板文字, 撮影者が主役より目立つ, 撮影者の顔が鮮明, 観客が鮮明すぎる, カメラマン全員にピントが合っている, 主役以外がシャープ, 過密すぎて主役が隠れる, 主役の顔にカメラが被る, 顔の前にレンズが被る, 背景がごちゃつきすぎる, アニメ調, イラスト調, 3D, フィギュア感, 人形感, 過剰なCG感, fake photo, plastic skin, watermark, signature`;\n\n    function getSelectedColor() {\n      return document.querySelector('input[name=\"color\"]:checked').value;\n    }\n\n    function selectedText(selectEl) {\n      return selectEl.options[selectEl.selectedIndex].textContent.trim();\n    }\n\n    function getCosplayValue() {\n      const cosplay = $('cosplay').value;\n      if (cosplay === 'custom') {\n        return $('customCosplay').value.trim() || 'a unique high-quality cosplay costume with carefully designed handmade details';\n      }\n      return cosplay;\n    }\n\n    function buildPrompt() {\n      const aspect = $('aspect').value;\n      const identity = $('identity').value;\n      const subject = $('mainSubject').value.trim() || 'Use the uploaded reference image as the identity reference for the main cosplayer';\n      const cosplay = getCosplayValue();\n      const venue = $('venue').value;\n      const crowdShape = $('crowdShape').value;\n      const expression = $('expression').value;\n      const pose = $('pose').value;\n      const color = getSelectedColor();\n      const lens = $('lens').value;\n      const blur = $('blur').value;\n      const extra = $('extra').value.trim();\n\n      const jp = `【画像参照・リアルフォト生成プロンプト】\n\nアップロードした参照画像を人物のアイデンティティ参照として使用してください。\n${subject}。\n構図やポーズをそのままコピーするのではなく、参照画像の顔立ち、髪型、髪色、前髪、目元、眉、鼻、口元、肌の印象、年齢感、全体の雰囲気を保ちながら、コスプレイベントのリアルな囲み撮影シーンとして自然に再構築してください。\n参照画像と最終構図の角度が一致しない場合でも、同一人物だと分かるように顔を自然に補完してください。別人化しないでください。\n\n【写真スタイル】\nリアルフォト。実際のコスプレイベントで撮影されたような、自然で高品質なイベントポートレート写真。\n${aspect}。\n${lens}。\n主役のコスプレイヤーだけに正確にピントを合わせ、肌、目、髪、衣装の質感は鮮明に描写してください。\n\n【コスプレ衣装】\n${cosplay}。\n衣装カラーは ${color}。\n布、レース、金属パーツ、リボン、アクセサリー、ブーツ、小道具などを高品質な手作り衣装のようにリアルに描写してください。\n衣装はイベント向けに華やかで完成度が高く、コスプレイヤー本人の魅力と参照画像の雰囲気に自然に馴染ませてください。\n\n【会場と囲み撮影】\n${venue}。\n${crowdShape}。\n周囲には一眼レフカメラ、望遠レンズ、スマートフォン、カメラストラップ、イベント参加者、撮影待機列、会場照明、イベント看板、パーテーションなどがある。\nただし、撮影している人達、観客、背景の人物、カメラ機材は主役より目立たせず、浅い被写界深度でしっかりボカしてください。\n${blur}。\n前景には大きくボケたカメラレンズやスマートフォンのシルエットを入れ、実際に囲み撮影されている臨場感を出してください。\nカメラフラッシュ、会場ライト、背景の光は美しい玉ボケとして処理してください。\n\n【表情とポーズ】\n${expression}。\n${pose}。\nプロのコスプレイヤーのように、カメラに慣れている自然な表情とポージングにしてください。\n表情は魅力的でフォトジェニック、目線はメインカメラ方向、または少し横のカメラへ向けてください。\n\n【品質】\nultra realistic photography, professional cosplay event photography, sharp main subject, detailed costume texture, realistic skin, realistic hair, cinematic event lighting, shallow depth of field, creamy bokeh, natural camera flash, high resolution, clean composition, immersive photo-call atmosphere。\n\n【追加指定】\n${extra || 'なし'}\n\n【重要】\n主役の人物だけを鮮明にし、撮影者・観客・背景人物は必ずボカしてください。\n主役の顔の前にカメラや手が被らないようにしてください。\n撮影者の顔を主役並みに鮮明に描かないでください。\n主役がフレーム内で最も目立つ構図にしてください。`;\n\n      const en = `Use the uploaded reference image as the identity reference for the main cosplayer.\n${subject}.\nDo not copy the exact pose or composition from the reference image. Reconstruct the person naturally as the main subject of a realistic cosplay event photo while preserving the face shape, eyes, eyebrows, nose, lips, hairstyle, hair color, bangs, skin impression, age impression and overall aura from the reference image.\n${identity}.\n\nREAL PHOTO STYLE:\nA realistic professional cosplay event photograph, ${aspect}.\n${lens}.\nThe main cosplayer must be tack sharp, with clear eyes, face, hair, skin texture and costume details.\n\nCOSPLAY COSTUME:\n${cosplay}.\nCostume color palette: ${color}.\nRender the fabric, lace, ribbons, metal pieces, accessories, boots, props and handmade costume details with realistic high-quality texture.\nThe costume should look glamorous, event-ready and naturally matched to the reference person's identity.\n\nEVENT VENUE AND PHOTO-CALL SCENE:\n${venue}.\n${crowdShape}.\nThere are DSLR cameras, telephoto lenses, smartphones, camera straps, spectators, waiting lines, venue lights, event signs and partitions around the subject.\nHowever, photographers, spectators, background people and camera equipment must not overpower the main cosplayer.\n${blur}.\nAdd large blurred camera lenses and smartphone silhouettes in the foreground to create the feeling of being surrounded by photographers.\nCamera flashes, venue lights and distant crowd lights should become beautiful bokeh.\n\nEXPRESSION AND POSE:\n${expression}.\n${pose}.\nThe pose should feel natural and professional, like an experienced cosplayer posing for many cameras.\nThe expression should be attractive, photogenic and realistic.\nThe eye gaze should face the main camera or slightly toward one of the surrounding cameras.\n\nQUALITY KEYWORDS:\nultra realistic photography, professional cosplay event photography, sharp main subject, detailed costume texture, realistic skin, realistic hair, cinematic event lighting, shallow depth of field, creamy bokeh, natural camera flash, high resolution, clean composition, immersive photo-call atmosphere.\n\nEXTRA INSTRUCTIONS:\n${extra || 'none'}\n\nIMPORTANT:\nOnly the main cosplayer should be sharp and visually dominant.\nPhotographers, spectators and background people must be blurred.\nDo not let cameras, hands or lenses cover the main subject's face.\nDo not make the photographers' faces as sharp as the main subject.\nKeep the main cosplayer as the clear center of attention.`;\n\n      prompts = { jp, en, negative: negativePrompt };\n      $('output').value = prompts[currentTab];\n      setStatus('生成しました');\n    }\n\n    function setStatus(text) {\n      status.textContent = text;\n      clearTimeout(setStatus.timer);\n      setStatus.timer = setTimeout(() => status.textContent = '', 1800);\n    }\n\n    async function copyText(text) {\n      try {\n        await navigator.clipboard.writeText(text);\n        setStatus('コピーしました');\n      } catch (e) {\n        $('output').select();\n        document.execCommand('copy');\n        setStatus('コピーしました');\n      }\n    }\n\n    function setTab(tab) {\n      currentTab = tab;\n      document.querySelectorAll('.tabbar button').forEach(btn => {\n        btn.classList.toggle('active', btn.dataset.tab === tab);\n      });\n      $('output').value = prompts[tab] || '';\n    }\n\n    function setSelectByText(selectId, keyword) {\n      const el = $(selectId);\n      for (const option of el.options) {\n        if (option.textContent.includes(keyword)) {\n          el.value = option.value;\n          return;\n        }\n      }\n    }\n\n    function setColorByLabel(keyword) {\n      document.querySelectorAll('#colors .chip').forEach(label => {\n        const span = label.querySelector('span');\n        const input = label.querySelector('input');\n        if (span.textContent.includes(keyword)) input.checked = true;\n      });\n    }\n\n    function applyPreset(name) {\n      if (name === 'princess') {\n        setSelectByText('cosplay', '幻想プリンセス');\n        setSelectByText('venue', '会場内・大型ホール');\n        setSelectByText('crowdShape', '半円');\n        setSelectByText('expression', '自信');\n        setSelectByText('pose', '中央');\n        setSelectByText('lens', '85mm');\n        setSelectByText('blur', '強く');\n        setColorByLabel('ピンク');\n      }\n      if (name === 'cyber') {\n        setSelectByText('cosplay', 'サイバーアイドル');\n        setSelectByText('venue', '企業ブース');\n        setSelectByText('crowdShape', '左右');\n        setSelectByText('expression', 'クール');\n        setSelectByText('pose', 'キャラポーズ');\n        setSelectByText('lens', '望遠');\n        setSelectByText('blur', '光の玉');\n        setColorByLabel('紫');\n      }\n      if (name === 'gothic') {\n        setSelectByText('cosplay', 'ゴシックロリータ');\n        setSelectByText('venue', '夜イベント');\n        setSelectByText('crowdShape', '密集');\n        setSelectByText('expression', 'ミステリアス');\n        setSelectByText('pose', '横向き');\n        setSelectByText('lens', '望遠');\n        setSelectByText('blur', '前景');\n        setColorByLabel('黒');\n      }\n      if (name === 'outdoor') {\n        setSelectByText('cosplay', '学園アイドル');\n        setSelectByText('venue', '会場外・都市型広場');\n        setSelectByText('crowdShape', '前列');\n        setSelectByText('expression', '元気');\n        setSelectByText('pose', 'ピース');\n        setSelectByText('lens', '35mm');\n        setSelectByText('blur', '前景');\n        setColorByLabel('黄');\n      }\n      $('customCosplay').classList.toggle('hidden', $('cosplay').value !== 'custom');\n      buildPrompt();\n    }\n\n    function resetForm() {\n      $('aspect').selectedIndex = 0;\n      $('identity').selectedIndex = 0;\n      $('mainSubject').value = 'アップロードした参照画像の人物を主役のコスプレイヤーとして使用';\n      $('cosplay').selectedIndex = 0;\n      $('customCosplay').value = '';\n      $('customCosplay').classList.add('hidden');\n      $('venue').selectedIndex = 0;\n      $('crowdShape').selectedIndex = 0;\n      $('expression').selectedIndex = 0;\n      $('pose').selectedIndex = 0;\n      $('lens').selectedIndex = 0;\n      $('blur').selectedIndex = 0;\n      $('extra').value = '';\n      document.querySelector('input[name=\"color\"]').checked = true;\n      currentTab = 'jp';\n      setTab('jp');\n      buildPrompt();\n      setStatus('初期化しました');\n    }\n\n    $('generateBtn').addEventListener('click', buildPrompt);\n    $('copyBtn').addEventListener('click', () => copyText($('output').value));\n    $('copyNegativeBtn').addEventListener('click', () => copyText(prompts.negative || negativePrompt));\n    $('resetBtn').addEventListener('click', resetForm);\n\n    $('cosplay').addEventListener('change', () => {\n      $('customCosplay').classList.toggle('hidden', $('cosplay').value !== 'custom');\n      buildPrompt();\n    });\n\n    document.querySelectorAll('select, input, textarea').forEach(el => {\n      el.addEventListener('input', buildPrompt);\n      el.addEventListener('change', buildPrompt);\n    });\n\n    document.querySelectorAll('.tabbar button').forEach(btn => {\n      btn.addEventListener('click', () => setTab(btn.dataset.tab));\n    });\n\n    document.querySelectorAll('.preset-card').forEach(card => {\n      card.addEventListener('click', () => applyPreset(card.dataset.preset));\n    });\n\n    buildPrompt();\n  <\/script></body>\n</html>"
    },
